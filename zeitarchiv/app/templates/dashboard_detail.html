<!doctype html>
<html lang="de" data-color-scheme="{{ color_scheme | default('zeitarchiv') }}" data-color-mode="{{ color_mode | default('auto') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitarchiv — {{ dashboard.name }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ base }}/static/css/app.css?v={{ css_v }}">
<style>:root{--font-scale:{{ font_scale_value }};--dashboard-row-height:{{ dashboard_row_height | default(218) }}px;}</style>
<style>
  /* Identisch zu den Dashboard-Kachel-Styles in entities.html — dieselbe
     Kachel-Mechanik (Konzept "Offene Punkte"/"Dashboards"), nur auf einer
     zweiten, unabhängigen Seitentiefe eingehängt. */
  [x-cloak]{display:none!important;}
  .dashboard-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:var(--dashboard-row-height);gap:14px;align-items:stretch;}
  /* Präziser Modus: Gitter und Zeilenhöhe halbieren sich gleichzeitig (3->6
     Spalten) — bestehende Kachelgrößen wirken dadurch weiterhin gleich groß,
     weil set_dashboard_precise_mode() sie beim Umschalten mitverdoppelt.
     grid-column/-row selbst kommen unverändert aus --tile-cols/--tile-rows
     (s.u.), die hier nicht neu gesetzt werden müssen. */
  .dashboard-grid.is-precise{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:calc(var(--dashboard-row-height) / 2);}
  /* Lücken auffüllen — der Browser packt spätere, kleinere Kacheln in Lücken
     statt strikt der Anheft-Reihenfolge zu folgen. Unabhängig vom Präzisen
     Modus kombinierbar, deshalb eine eigene Klasse statt in is-precise mit
     eingebaut. */
  .dashboard-grid.is-dense{grid-auto-flow:dense;}
  .dtile{
    position:relative;min-width:0;grid-column:span var(--tile-cols,1);grid-row:span var(--tile-rows,1);
    border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:visible;cursor:grab;
  }
  .dtile[data-grid-cols="2"]{grid-column:span 2;}
  .dtile[data-grid-cols="3"]{grid-column:span 3;}
  .dtile[data-grid-rows="2"]{grid-row:span 2;}
  .dtile[data-grid-rows="3"]{grid-row:span 3;}
  .dtile.dragging{opacity:.4;}
  .dtile:has(.dtile-menu.is-open){z-index:20;}
  .dtile-add{cursor:default;}
  .dtile-body{display:flex;flex-direction:column;height:100%;box-sizing:border-box;color:inherit;text-decoration:none;padding:14px 14px 10px;overflow:hidden;border-radius:inherit;}
  .dtile-title{font-size:calc(13.5px * var(--font-scale, 1));font-weight:600;color:var(--ink);margin-bottom:8px;padding-right:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dtile-chart{height:auto;min-height:160px;flex:1;}
  .dtile-loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-family:var(--font-mono);font-size:calc(12px * var(--font-scale, 1));}
  /* Werte-Kachel (item_type='entity') — reiner aktueller Wert statt Chart/
     Tabelle, siehe _dashboard_tiles_context() in main.py. */
  /* Dreiteiliges Layout über die volle Kachelhöhe: Titel bleibt oben (eigene
     Zeile, linksbündig, .stat .label-Optik), Sparkline bleibt unten (eigene
     Zeile, volle Breite), der Wert (mit Einheit/Alter) füllt den Rest der
     Höhe (flex:1) und wird darin auf beiden Achsen zentriert. Titel/Sparkline
     bekommen dadurch flex:none, damit nur die Wert-Zeile wächst/schrumpft. */
  .dtile-entity-body{display:flex;flex-direction:column;gap:4px;}
  .dtile-entity-body .dtile-title{
    flex:none;text-align:left;margin-bottom:0;padding-top:4px;
    font-size:calc(12.5px * var(--font-scale, 1));color:var(--ink-faint);font-weight:500;
  }
  .dtile-entity-value{
    flex:1;min-height:0;display:flex;align-content:center;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:5px;
  }
  .dtile-entity-main{display:flex;align-items:baseline;gap:5px;}
  .dtile-entity-number{font-family:var(--font-display);font-size:calc(28px * var(--font-scale, 1));font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
  .dtile-entity-unit{font-size:calc(14px * var(--font-scale, 1));color:var(--ink-muted);}
  /* Wie .stat .sub-value: kein Mono, dieselbe dezente Farbe/Größe — bleibt
     unabhängig vom Alter immer neutral, siehe .dtile-entity.is-warn/is-stale
     unten (nur der Kartenrahmen zeigt "veraltet" an, nicht der Text). Kein
     margin-left:auto mehr — sitzt jetzt als normales, mitzentriertes Element
     neben Wert/Einheit statt separat rechtsbündig. */
  .dtile-entity-age{font-size:calc(12px * var(--font-scale, 1));color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* Letzter Wert älter als 15 Minuten (gelb) bzw. eine Stunde (rot) — nur der
     Kartenrahmen hebt das hervor, der Wert selbst bleibt immer schwarz
     (Konzept-Wunsch). is-warn/is-stale werden sowohl beim Server-Rendern
     (Erstanzeige) als auch client-seitig nach jedem Live-Fetch gesetzt
     (dashboard-tiles.js renderEntityTile()) — Letzteres ist die verlässliche
     Quelle, siehe der last_value-Bug, der zum Umstieg auf Live-Fetches
     geführt hat. #D9A22B dieselbe Gold-Farbe wie der Favoriten-Stern
     (.fav-star.active), da die App keine eigene Gelb/Warn-Variable kennt;
     Rot wiederverwendet die bestehende --danger-Variable. */
  .dtile-entity.is-warn{border-width:2px;border-color:#D9A22B;}
  .dtile-entity.is-stale{border-width:2px;border-color:var(--danger);}
  /* .sparkline/.area/.line selbst kommen aus app.css (dieselbe Optik wie die
     Statistik-Kacheln der Übersichtsseite) — dieser Wrapper regelt nur den
     Abstand zur Werte-Zeile darüber. */
  .dtile-entity-sparkline{flex:none;width:100%;margin-top:6px;}
  /* Einzeilige Kachel (unabhängig von der Spaltenzahl — 1x1 UND z. B. 2x1
     haben dieselbe begrenzte Höhe): weniger Abstand statt Inhalte
     auszublenden, damit Titel + Wert + (falls aktiv) Sparkline trotzdem
     hineinpassen. Nur an data-grid-rows geknüpft, nicht zusätzlich an
     data-grid-cols — sonst bliebe z. B. 2x1 unkomprimiert und Inhalt könnte
     abgeschnitten werden, obwohl 1x1 (dieselbe Höhe) schon komprimiert. */
  .dtile-entity[data-grid-rows="1"] .dtile-body{padding:10px 10px 8px;}
  .dtile-entity[data-grid-rows="1"] .dtile-entity-body{gap:2px;}
  .dtile-entity[data-grid-rows="1"] .dtile-title{padding-top:0;}
  .dtile-entity[data-grid-rows="1"] .dtile-entity-number{font-size:calc(20px * var(--font-scale, 1));}
  .dtile-entity[data-grid-rows="1"] .dtile-entity-sparkline{margin-top:2px;}
  .dtile-picker-search{
    width:100%;box-sizing:border-box;font-family:inherit;font-size:calc(12.5px * var(--font-scale, 1));
    padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--ink);margin:10px 16px 0;width:calc(100% - 32px);
  }
  .dtile-picker-list{max-height:280px;overflow-y:auto;padding:10px 10px 12px;}
  /* Optionale Chart-Legende unter der Kachel — siehe entities.html (dieselbe
     Regeln, hier dupliziert wie der Rest des .dtile-Blocks). Die Chips selbst
     nutzen .chart-legend-item aus app.css unverändert — Aussehen UND Inhalte
     entsprechen 1:1 der Legende der zugrundeliegenden Chart-Seite. */
  .dtile-legend{display:none;flex-wrap:wrap;gap:8px;padding-top:10px;flex:none;}
  .dtile-legend.is-visible{display:flex;}
  /* Tabellen-Stil (Legenden-Stil "Tabelle") als einzelnes Flex-Kind soll die
     volle Kachelbreite füllen statt (wie ein Chip) auf Inhaltsbreite zu
     schrumpfen. */
  .dtile-legend .tbl-wrap{width:100%;}
  .dtile-add{display:flex;align-items:center;justify-content:center;min-height:206px;grid-column:span 1;grid-row:span 1;border-style:dashed;overflow:visible;}
  /* Präziser Modus: Spalten und Zeilenhöhe sind halbiert (s.o.), eine 1x1-
     Zelle wäre also nur ein Sechstel breit und halb so hoch — die feste
     min-height:206px würde sie zusätzlich über ihre Gitterzeile hinaus
     drücken. 2x2 Zellen entsprechen genau einer normalen Kachel, analog zur
     Verdopplung der Kachelgrößen in set_dashboard_precise_mode(). */
  .dashboard-grid.is-precise .dtile-add{grid-column:span 2;grid-row:span 2;}
  .dtile-add-btn{
    width:44px;height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--ink-muted);font-size:calc(22px * var(--font-scale, 1));line-height:1;cursor:pointer;
  }
  .dtile-add-btn:hover{color:var(--accent-line);border-color:var(--accent-line);}
  /* Größeres "Kachel hinzufügen"-Popup mit Registerkarten (Charts/Tabellen/
     Werte) statt der früheren, alle drei Abschnitte untereinander
     stapelnden Liste — dieselbe position:fixed-Overlay-Mechanik wie das
     Werte-Kachel-Einstellungs-Popup oben (siehe .dtile-settings-overlay). */
  .dtile-picker-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;padding:16px;cursor:default;
  }
  .dtile-picker-modal{
    width:360px;max-width:100%;max-height:100%;background:var(--surface);border-radius:12px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;text-align:left;
  }
  .dtile-picker-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--border);
  }
  .dtile-picker-title{margin:0;font-weight:600;font-size:calc(15px * var(--font-scale, 1));color:var(--ink);}
  .dtile-picker-close{
    flex:none;width:28px;height:28px;padding:0;border:1px solid var(--border);border-radius:999px;
    background:var(--surface);color:var(--ink-faint);font-size:calc(13px * var(--font-scale, 1));cursor:pointer;
  }
  .dtile-picker-close:hover{color:var(--accent-line);border-color:var(--accent-line);}
  .dtile-picker-tabs{display:flex;gap:4px;padding:12px 16px 0;}
  .dtile-picker-tabs button{
    flex:1;padding:7px 0;border:1px solid var(--border);border-radius:8px;background:var(--surface);
    color:var(--ink-muted);font-family:inherit;font-size:calc(12.5px * var(--font-scale, 1));cursor:pointer;
  }
  .dtile-picker-tabs button.active{background:var(--accent-line-soft);border-color:var(--accent-line);color:var(--accent-line);font-weight:600;}
  .dtile-picker-item{
    display:block;width:100%;text-align:left;padding:8px 10px;border-radius:7px;border:none;background:none;
    color:var(--ink);font-size:calc(13px * var(--font-scale, 1));cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    text-decoration:none;box-sizing:border-box;
  }
  .dtile-picker-item:hover{background:var(--surface-alt);}
  .dtile-picker-new{color:var(--accent-line);font-weight:600;margin-bottom:4px;}
  .dtile-picker-label + .dtile-picker-new{margin-top:-2px;}

  .dtile-menu{position:absolute;top:6px;right:6px;z-index:4;}
  .dtile-menu-btn{
    width:24px;height:24px;padding:0;border:1px solid var(--border);border-radius:999px;
    background:var(--surface);color:var(--ink-faint);font-size:calc(17px * var(--font-scale, 1));line-height:1;cursor:pointer;
  }
  .dtile-menu-btn:hover,.dtile-menu.is-open .dtile-menu-btn{color:var(--accent-line);border-color:var(--accent-line);}
  .dtile-menu-popover{
    position:absolute;top:30px;right:0;width:216px;padding:10px;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);cursor:default;
  }
  .dtile-size-picker-head{font-size:calc(11px * var(--font-scale, 1));color:var(--ink-muted);white-space:nowrap;margin-bottom:8px;}
  .dtile-size-picker-head strong{float:right;color:var(--ink);font-family:var(--font-mono);}
  .dtile-size-grid{display:grid;grid-template-columns:repeat(3,24px);grid-template-rows:repeat(3,24px);gap:4px;justify-content:center;}
  .dtile-size-cell{
    width:24px;height:24px;padding:0;border:1px solid var(--border);border-radius:4px;background:var(--surface-alt);cursor:pointer;
  }
  .dtile-size-cell.is-selected,.dtile-size-cell.is-preview{background:var(--accent-line-soft);border-color:var(--accent-line);}
  /* Präziser Modus: 6x6 statt 3x3 Zellen — kleinere Zellen statt eines
     breiteren Popovers, damit .dtile-menu-popover für beide Modi gleich
     breit bleiben kann. */
  .dtile-menu.is-precise .dtile-size-grid{grid-template-columns:repeat(6,18px);grid-template-rows:repeat(6,18px);}
  .dtile-menu.is-precise .dtile-size-cell{width:18px;height:18px;}
  /* Nachkommastellen-Override (Werte-Kacheln) — dieselbe Zellen-Optik wie
     die Kachelgröße oben, nur als eine einzelne Reihe mit Ziffern statt
     eines Rasters. */
  .dtile-decimals-picker-head{font-size:calc(11px * var(--font-scale, 1));color:var(--ink-muted);white-space:nowrap;margin-bottom:8px;}
  .dtile-decimals-picker-head strong{float:right;color:var(--ink);font-family:var(--font-mono);}
  .dtile-decimals-row{display:flex;gap:4px;}
  .dtile-decimals-cell{
    flex:1;padding:5px 0;border:1px solid var(--border);border-radius:6px;background:var(--surface-alt);
    color:var(--ink);font-family:var(--font-mono);font-size:calc(11px * var(--font-scale, 1));cursor:pointer;text-align:center;
  }
  .dtile-decimals-cell:hover{border-color:var(--accent-line);}
  .dtile-decimals-cell.is-selected{background:var(--accent-line-soft);border-color:var(--accent-line);color:var(--accent-line);font-weight:600;}
  /* Eigener Kachel-Titel (Werte-Kacheln) — dieselbe Feld-Optik wie die
     Entitäten-Suche des "+"-Pickers (.dtile-picker-search). */
  .dtile-title-field{display:flex;flex-direction:column;gap:5px;}
  /* .menu-row-label hat sonst keine eigene Schriftgröße (erbt sie normalerweise
     von .menu-row) — hier explizit dieselbe Größe wie die übrigen
     Options-Überschriften (Kachelgröße/Nachkommastellen), sonst wirkt "Titel"
     im Vergleich überdimensioniert. */
  .dtile-title-field .menu-row-label{font-size:calc(11px * var(--font-scale, 1));color:var(--ink-muted);}
  .dtile-title-input{
    width:100%;box-sizing:border-box;font-family:inherit;font-size:calc(12.5px * var(--font-scale, 1));
    padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-alt);color:var(--ink);
  }
  .dtile-size-preview{text-align:center;margin-top:7px;color:var(--ink-faint);font-family:var(--font-mono);font-size:calc(10.5px * var(--font-scale, 1));}
  .dtile-menu-divider{height:1px;background:var(--border);margin:10px -2px 8px;}
  .dtile-menu-remove{
    display:block;width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;
    color:var(--danger);font-family:inherit;font-size:calc(12px * var(--font-scale, 1));text-align:left;cursor:pointer;
  }
  .dtile-menu-remove:hover{background:var(--danger-soft);}

  /* Großes Einstellungs-Popup für Werte-Kacheln (siehe Kommentar in
     _dashboard_tile_menu.html) — position:fixed statt der relativen
     .dtile-menu-popover-Positionierung, damit es unabhängig von der
     (oft sehr kleinen) Kachel selbst mittig im Sichtfenster erscheint. */
  .dtile-settings-overlay{
    position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;padding:16px;cursor:default;
  }
  .dtile-settings-modal{
    width:380px;max-width:100%;max-height:100%;background:var(--surface);border-radius:12px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;text-align:left;
  }
  .dtile-settings-header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--border);
  }
  .dtile-settings-title{
    margin:0;min-width:0;flex:1;font-weight:600;font-size:calc(15px * var(--font-scale, 1));
    color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .dtile-settings-close{
    flex:none;width:28px;height:28px;padding:0;border:1px solid var(--border);border-radius:999px;
    background:var(--surface);color:var(--ink-faint);font-size:calc(13px * var(--font-scale, 1));cursor:pointer;
  }
  .dtile-settings-close:hover{color:var(--accent-line);border-color:var(--accent-line);}
  .dtile-settings-body{padding:16px;overflow-y:auto;}
  .dtile-settings-section + .dtile-settings-section{border-top:1px solid var(--border);margin-top:16px;padding-top:16px;}
  .dtile-settings-section .dtile-size-preview{margin-top:9px;}
  .dtile-settings-footer{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:12px 16px;border-top:1px solid var(--border);
  }

  .dtile-table-preview{height:auto;min-height:160px;flex:1;overflow:auto;}
  /* Ohne gespeicherte Spaltenbreiten/"Spalten gleichmäßig" (kein <colgroup>,
     siehe renderTableTile() in dashboard-tiles.js) bleibt die Tabelle
     width:100% mit table-layout:auto — der Browser staucht die Spalten dann
     selbst auf die Kachelbreite und bricht Zellinhalte bei Bedarf um, statt
     Text hart abzuschneiden. Nur wenn EIN Wert wirklich nicht mehr umbrechen
     kann (colWidthAttr/widthCss setzen dann inline white-space:nowrap für
     genau diese Zelle), bleibt der overflow:auto-Scrollbalken die einzige
     Ausweichmöglichkeit. Bei gespeicherten Breiten ODER "gleichmäßig"
     überschreibt das inline table-layout:fixed (höhere Spezifität) diese
     Basisregel — die Tabelle darf dann breiter als die Kachel werden, siehe
     tableWidthAttr/colgroup dort. */
  table.dt.dtile-mini-table{width:100%;table-layout:auto;}
  .dtile-mini-table th,.dtile-mini-table td{padding:4px 8px;white-space:normal;word-break:break-word;}
  .dtile-mini-table th:not(:first-child){text-align:right;}
  .dtile-mini-table.tbl-style-header-align-left th:not(:first-child){text-align:left;}
  .dtile-mini-table.tbl-style-header-align-center th:not(:first-child){text-align:center;}
  .dtile-mini-table td.tbl-num{text-align:right;font-variant-numeric:tabular-nums;}
  .dtile-mini-table.tbl-style-value-align-left td.tbl-num{text-align:left;}
  .dtile-mini-table.tbl-style-value-align-left td.tbl-num .tbl-cell{justify-content:flex-start;}
  .dtile-mini-table.tbl-style-value-align-center td.tbl-num{text-align:center;}
  .dtile-mini-table.tbl-style-value-align-center td.tbl-num .tbl-cell{justify-content:center;}
  /* table-layout:fixed richtet sich nach der ersten Zeile (Kopfzeile) —
     dieselbe Regel wie table_editor.html, siehe dortiger Kommentar bei
     .tbl-style-equal-cols. Die Beschriftungsspalte bekommt ihre Breite über
     labelWidthAttr() (style.label_col_width), das dashboard-tiles.js beim
     Rendern der Kachel setzt — dieselbe gespeicherte Breite wie im Editor. */
  table.dt.dtile-mini-table.tbl-style-equal-cols{table-layout:fixed;width:100%;}
  /* Mobil dieselbe Rückfallregel wie in table_editor.html: Inhaltsbreite und
     Scrollen in .dtile-table-preview statt 15px-Wertespalten. Greift nur für
     Tabellen ohne gespeicherte Spaltenbreiten — mit tableWidthAttr()
     (Inline min-width) ist die Tabelle ohnehin nicht komprimierbar. */
  @media (max-width:820px){
    table.dt.dtile-mini-table.tbl-style-equal-cols{table-layout:auto;width:auto;min-width:100%;}
  }
  .tbl-cell{display:inline-flex;justify-content:flex-end;align-items:baseline;gap:.3em;white-space:nowrap;}
  .tbl-cell-number{white-space:nowrap;}
  .tbl-cell-deviation{display:block;margin-top:1px;color:var(--ink-faint);font-size:calc(9.5px * var(--font-scale, 1));font-weight:400;line-height:1.1;}
  .dtile-mini-table tr.tbl-bold td{font-weight:700;color:var(--ink);}
  .dtile-mini-table tr.tbl-separator-row td{padding:4px 6px;border:0;background:transparent !important;box-shadow:none !important;}
  .tbl-separator-content{display:flex;align-items:center;gap:8px;width:100%;}
  .tbl-separator-line{display:block;flex:1;height:1px;background:var(--border);}
  .tbl-separator-label{color:var(--ink-muted);font-size:calc(9.5px * var(--font-scale, 1));font-weight:650;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap;}
  tr.tbl-bold.tbl-separator-row .tbl-separator-label{font-weight:800;color:var(--ink);}
  .tbl-group-header{text-align:center;font-size:calc(9.5px * var(--font-scale, 1));color:var(--ink-muted);border-bottom:1px solid var(--border);}
  .dtile-table-more{text-align:center!important;color:var(--ink-faint);font-style:italic;}
  .tbl-style-zebra tr.tbl-zebra-alt td{background:var(--surface-alt);}
  .tbl-style-border-grid td,.tbl-style-border-grid th{border:1px solid var(--border);}
  .tbl-style-border-none td,.tbl-style-border-none th{border-bottom:none;}
  /* padding:0 (statt 2px) vertikal — spürbar unter dem Komfortabel-Grundmaß
     (.dtile-mini-table th/td oben: 4px 8px), sonst kaum sichtbarer
     Unterschied zwischen den beiden Dichte-Optionen. */
  .tbl-style-compact td,.tbl-style-compact th{padding:0 6px;}
  .tbl-style-compact tr.tbl-separator-row td{padding:2px 6px;}
  /* tr.tbl-header-row statt tr:first-child — bei mehrstufigen Spaltenköpfen
     (col.group_label) steht eine zusätzliche Kopfzeile davor, siehe
     dieselbe Umstellung in table_editor.html. */
  .tbl-style-header-accent tr.tbl-header-row th{background:var(--accent-line);color:var(--accent-contrast);}
  .tbl-style-header-accent tr.tbl-group-header-row th{background:color-mix(in srgb, var(--accent-line) 80%, black);}
  .tbl-style-first-col-accent td:first-child{
    background:color-mix(in srgb, var(--accent-line) 13%, var(--surface)) !important;
    color:var(--accent-line) !important;
  }
  .tbl-style-first-col-accent.tbl-style-zebra tr.tbl-zebra-alt td:first-child{background:color-mix(in srgb, var(--accent-line) 24%, var(--surface)) !important;}
  .tbl-style-first-col-bold td:first-child{font-weight:700;}
  /* War früher ein globaler style.formula_row_accent-Schalter, jetzt pro
     Formelzeile über row.accent — siehe dieselbe Umstellung in
     table_editor.html. */
  tr.tbl-formula-row.tbl-row-accent td{background:color-mix(in srgb, var(--accent-line) 7%, var(--surface)) !important;border-top:2px solid color-mix(in srgb, var(--accent-line) 35%, var(--border));}
  /* background hier explizit statt sich auf Zebra/Erste-Spalte-hervorheben
     zu verlassen — eine SICHTBAR fixierte Spalte muss immer blickdicht
     sein (Zeilen ohne diese anderen Optionen hatten sonst gar keinen
     Hintergrund und darunter wegscrollender Text schimmerte durch). */
  .tbl-style-sticky-first-col th:first-child,.tbl-style-sticky-first-col td:first-child{position:sticky;left:0;z-index:2;box-shadow:1px 0 0 var(--border);background:var(--surface);}
  .tbl-style-sticky-first-col th:first-child{z-index:3;}
  /* Sticky auf dem GANZEN thead statt auf einzelnen th, siehe dieselbe
     Umstellung in table_editor.html: zwei Kopfzeilen (Gruppen- + Zeitraum-
     Zeile) würden sonst beide um dieselbe top:0-Position konkurrieren und
     sich beim Scrollen überlappen. */
  /* Nicht auf thead/tr (Safari unterstützt sticky dort nicht zuverlässig),
     siehe ausführlicher Kommentar in table_editor.html bei derselben Regel. */
  .tbl-style-sticky-header tr.tbl-header-row th{position:sticky;top:0;z-index:2;background:var(--surface);box-shadow:0 1px 0 var(--border);}
  /* Bei border-collapse:collapse bleibt der echte th-Rahmen beim Verschieben
     an seiner ursprünglichen Tabellenposition und erscheint als Strich
     mitten im Sticky-Header. Deshalb dort nur den kollabierten Rahmen
     entfernen; der box-shadow aus der Regel darüber bewegt sich korrekt mit
     der Zelle und bleibt als einzelne 1-px-Unterkante sichtbar. */
  table.dt.dtile-mini-table.tbl-style-sticky-header tr.tbl-header-row th{border-bottom:0;}
  .tbl-style-sticky-header.tbl-style-header-accent tr.tbl-header-row th{background:var(--accent-line);}
  .tbl-style-sticky-header.tbl-style-header-accent tr.tbl-group-header-row th{background:color-mix(in srgb, var(--accent-line) 80%, black);}
  .tbl-style-sticky-header tr.tbl-header-row:not(.tbl-group-header-row) th{top:var(--tbl-group-header-h,0px);}
  /* Schnittzelle von fixiertem Header und fixierter erster Spalte muss über
     BEIDEN Sticky-Ebenen liegen. Die spätere Header-Regel ist spezifischer
     als `.tbl-style-sticky-first-col th:first-child` und setzte deren
     z-index:3 sonst wieder auf 2 zurück. Dann übermalte beim vertikalen
     Scrollen die erste Datenzelle die linke obere Headerzelle. */
  .tbl-style-sticky-header.tbl-style-sticky-first-col tr.tbl-header-row th:first-child{z-index:4;}
  .tbl-style-comparison-columns:not(.tbl-style-header-accent) .tbl-comparison-col{color:var(--ink-muted);}
  .tbl-style-comparison-columns.tbl-style-header-accent th.tbl-comparison-col{color:color-mix(in srgb, var(--accent-contrast) 72%, var(--accent-line));}
  .tbl-style-align-units .tbl-cell-unit{display:inline-block;min-width:3.5em;text-align:left;color:var(--ink-muted);}
  .tbl-style-small-units .tbl-cell-unit{font-size:.82em;color:var(--ink-muted);}
  .tbl-style-align-numbers .tbl-cell-number{display:inline-grid;grid-template-columns:auto .45em 2.4em;align-items:baseline;text-align:right;}
  .tbl-style-align-numbers .tbl-number-separator{text-align:center;}
  .tbl-style-align-numbers .tbl-number-fraction{text-align:left;}
  @media (max-width:820px){
    .dashboard-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .dtile[data-grid-cols="3"]{grid-column:span 2;}
  }
  @media (max-width:520px){
    /* Die Desktop-Regel .dashboard-grid.is-precise ist spezifischer als die
       bisherige mobile .dashboard-grid-Regel und hielt das Raster deshalb
       im Präzisen Modus bei sechs schmalen Spalten. Auch .dtile-add hatte
       dort durch die präzisere 2-Spalten-Regel Vorrang. Mobil werden daher
       Raster und sämtliche Kacheln ausdrücklich auf eine Spalte gesetzt. */
    .dashboard-grid,.dashboard-grid.is-precise{grid-template-columns:minmax(0,1fr);}
    .dtile,.dtile[data-grid-cols="2"],.dtile[data-grid-cols="3"]{grid-column:span 1;}
    .dashboard-grid.is-precise .dtile{grid-column:span 1;}
  }
  .dash-title-row{display:flex;align-items:center;gap:10px;}
  .dash-rename-btn{color:var(--ink-faint);text-decoration:none;padding:2px;}
  .dash-rename-btn:hover{color:var(--accent-line);}
  .dash-locked-badge{font-size:calc(16px * var(--font-scale, 1));cursor:default;opacity:.75;}
</style>
</head>
<body>
  {% include "_topnav.html" %}
  <div class="page">
    <div class="dash-title-row">
      <h1>{{ dashboard.name }}</h1>
      {% if dashboard.locked %}
      <span class="dash-locked-badge" title="Fixiert">🔒</span>
      {% else %}
      <a class="dash-rename-btn" href="{{ base }}/dashboards/{{ dashboard.id }}/edit" title="Bearbeiten">✎</a>
      {% endif %}
    </div>

    <div class="dashboard-section">
      {% include "_dashboard_tiles.html" %}
    </div>
  </div>

  <script src="{{ base }}/static/vendor/htmx.min.js?v={{ vendor_v }}"></script>
  <script src="{{ base }}/static/vendor/echarts.min.js?v={{ vendor_v }}"></script>
  <script src="{{ base }}/static/js/number-format.js?v={{ js_v }}"></script>
  <script src="{{ base }}/static/js/entity-picker.js?v={{ js_v }}"></script>
  <script src="{{ base }}/static/js/confirm-dialog.js?v={{ js_v }}"></script>
  <script src="{{ base }}/static/js/table-compute.js?v={{ js_v }}"></script>
  <script src="{{ base }}/static/js/dashboard-tiles.js?v={{ js_v }}"></script>
</body>
</html>
