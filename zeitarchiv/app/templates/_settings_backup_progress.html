<div id="backup-status" hx-get="backup/progress" hx-trigger="every 500ms" hx-target="this" hx-swap="outerHTML">
  <p style="margin:0 0 8px;font-size:calc(13px * var(--font-scale, 1));color:var(--ink-muted);">
    <strong style="color:var(--ink);">{{ done }}</strong> von <strong style="color:var(--ink);">{{ total }}</strong> Dateien gesichert&hellip;
  </p>
  <div style="height:8px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--border);overflow:hidden;">
    <div style="height:100%;width:{{ percent }}%;background:var(--accent-line);transition:width .3s ease;"></div>
  </div>
</div>
