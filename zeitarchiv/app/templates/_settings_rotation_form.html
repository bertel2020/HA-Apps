<div class="stat-row" style="margin-bottom:16px;">
  <div class="stat" style="flex:0 1 220px;">
    <div class="label">{{ _("Ausstehende Rotation") }}</div>
    <div class="value">{{ stale_count }}</div>
    <div class="sub-value">{{ _("Entität") if stale_count == 1 else _("Entitäten") }}</div>
  </div>
</div>
<div style="display:flex;justify-content:flex-end;">
  <button type="button" class="btn" hx-post="settings/rotation" hx-target="#rotation-form" hx-swap="innerHTML"
          hx-confirm="{{ _('Ausstehende Entitäten jetzt rotieren (letzte Hot-Datei ins Archiv verschieben)?') }}">{{ _("Jetzt rotieren") }}</button>
</div>
{% if result %}<p class="save-status">✓ {{ result }}</p>{% endif %}
