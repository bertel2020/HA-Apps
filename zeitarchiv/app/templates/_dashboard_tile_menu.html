<div class="dtile-menu" x-data="{menuOpen: false}" :class="{'is-open': menuOpen}">
  <button type="button" class="dtile-menu-btn" draggable="false"
          @pointerdown.stop @click.prevent.stop="menuOpen = !menuOpen"
          :aria-expanded="menuOpen.toString()" aria-haspopup="menu"
          aria-label="Kachelmenü öffnen" title="Kachelmenü">⋮</button>
  <div class="dtile-menu-popover" x-show="menuOpen" x-cloak role="menu"
       @pointerdown.stop @click.outside="menuOpen = false">
    <div class="dtile-size-picker-head">Kachelgröße <strong>{{ tile.grid_cols }}×{{ tile.grid_rows }}</strong></div>
    <div class="dtile-size-grid" role="grid" aria-label="Kachelgröße bis 3 mal 3 auswählen">
      {% for row in range(1, 4) %}
      {% for col in range(1, 4) %}
      <button type="button"
              class="dtile-size-cell{% if col <= tile.grid_cols and row <= tile.grid_rows %} is-selected{% endif %}"
              role="gridcell" draggable="false" data-cols="{{ col }}" data-rows="{{ row }}"
              aria-label="{{ col }} mal {{ row }}" title="{{ col }}×{{ row }}"
              @click.prevent.stop="menuOpen = false"></button>
      {% endfor %}
      {% endfor %}
    </div>
    <div class="dtile-size-preview" aria-live="polite">{{ tile.grid_cols }}×{{ tile.grid_rows }}</div>
    <div class="dtile-menu-divider"></div>
    <button type="button" class="dtile-menu-remove" role="menuitem" draggable="false"
            hx-post="{{ 'charts' if tile.kind == 'chart' else 'tables' }}/{{ tile.id }}/unpin"
            hx-target="#dashboard-grid" hx-swap="outerHTML"
            hx-confirm="Diese Kachel wirklich vom Dashboard entfernen?"
            @click="menuOpen = false">Vom Dashboard entfernen</button>
  </div>
</div>
