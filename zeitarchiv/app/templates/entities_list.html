<!doctype html>
<html lang="de" data-color-scheme="{{ color_scheme | default('zeitarchiv') }}" data-color-mode="{{ color_mode | default('auto') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitarchiv — Entitäten</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="static/css/app.css?v={{ css_v }}">
<style>:root{--font-scale:{{ font_scale_value }};}</style>
<style>
  /* .settings-panel sitzt in einer Grid-Spalte (1fr) — ohne min-width:0
     würde diese Spalte (und damit die ganze Seite) sich an den intrinsischen
     Inhalt der (jetzt fest breiten statt gestauchten) Tabelle anpassen
     ("min-size:auto"-Falle bei Grid/Flex, dieselbe wie bei .tbl-columns in
     table_editor.html), statt dass .tbl-wrap's overflow-x:auto hier greift. */
  .settings-panel{min-width:0;}
  th a{
    display:block;width:100%;padding:8px 0;text-align:inherit;font-size:calc(12px * var(--font-scale, 1));font-weight:600;color:var(--ink-faint);text-decoration:none;white-space:nowrap;
  }
  th a.active{color:var(--accent-line);}
  th a:hover{color:var(--accent-line);}
  /* width:100% statt fit-content — bewusste Kursänderung ggü. dem früheren
     Ansatz (Tabelle immer exakt Summe der Spalten, nie gestreckt): bei wenigen
     aktiven Spalten (z. B. nur Entität+Typ+Erster/Letzter Wert wie im
     Standard-Zustand) blieb sichtbar ungenutzter Raum rechts stehen. Die
     deklarierten Spaltenbreiten unten wirken bei table-layout:fixed +
     width:100% als PROPORTIONEN, nach denen der Browser den verfügbaren Platz
     verteilt — Entität behält dadurch weiterhin den größten Anteil. Die
     min-width kommt NICHT von hier, sondern als Inline-Style direkt vom
     Server (_entities_table.html) — ein einzelner fester CSS-Wert könnte bei
     der laufzeitveränderlichen "Spalten"-Auswahl entweder unnötig Scroll
     erzwingen (zu hoch für wenige aktive Spalten) oder Überlappung riskieren
     (zu niedrig für viele aktive Spalten). Reicht der berechnete Platz nicht,
     greift .tbl-wrap's overflow-x:auto statt die Spalten zu stauchen —
     deshalb bleibt white-space:nowrap auf jeder Zelle. Breiten aus echten
     Textmessungen (Header-Label und längster realistischer Datenwert je
     Spalte) plus Zellpadding (2×14px); Entität zusätzlich über max-width auf
     .name/.id begrenzt (siehe unten), sonst bestimmt die oft sehr lange
     ungekürzte entity_id die Spaltenbreite statt der hier deklarierten. */
  table.entities-dt{table-layout:fixed;width:100%;}
  .entities-dt th,.entities-dt td{white-space:nowrap;}
  /* Seit die Sidebar-Navigation (_settings_nav.html) durch die globale
     Menüleiste ersetzt wurde, steht .settings-panel die volle .page-Breite
     zur Verfügung (statt vorher 1fr neben einer 190px-Sidebar) — die
     Spalten sind entsprechend breiter gezogen, Entität überproportional
     stark, da sie der einzige Frei-Text (Name + ID) ist. */
  .col-fav{width:40px;}
  .col-entity{width:330px;}    /* längster aktueller friendly_name ("Proxon FWT Energy (Tariff 1)") ≈ 172px + deutlich mehr Puffer für den nun verfügbaren Platz */
  .col-type{width:112px;}      /* Badge "Standard"/"Schalter" ≈ 68px + Puffer */
  .col-date{width:126px;}      /* "22.05.2014" ≈ 73px + Puffer */
  .col-resolution{width:104px;} /* "Rohdaten" ≈ 59px + Puffer */
  .col-retention{width:118px;} /* Header "Aufbewahrung" ≈ 82px + Puffer */
  .col-unit{width:84px;}       /* Header "Einheit" ≈ 40px + Puffer */
  .col-rows{width:114px;}      /* "1.857.990" ≈ 65px + Puffer */
  .col-size{width:96px;}       /* "14.8 MB" ≈ 51px + Puffer */
  /* Ausrichtung je Spalte statt Position (:not(:first-child)) — dieselbe
     Klasse steuert oben schon die Breite, für th UND td gemeinsam, damit
     Kopf- und Datenzeile nie auseinanderlaufen. Favorit + Typ zentriert;
     die sichtbaren Bestandsdaten (Zeitpunkte, Einheit, Datensätze, Größe)
     sind wie Entität linksbündig. Nur die optionalen Konfigurationsspalten
     bleiben rechtsbündig. th a{text-align:inherit} lässt die Ausrichtung vom
     <th> auf den Sortierlink durchreichen. */
  .entities-dt th.col-fav,.entities-dt td.col-fav,
  .entities-dt th.col-type,.entities-dt td.col-type{text-align:center;}
  .entities-dt th.col-date,.entities-dt td.col-date,
  .entities-dt th.col-size,.entities-dt td.col-size{text-align:left;}
  /* Diese beiden Bestandswerte bleiben ausdrücklich linksbündig — auch wenn
     spätere generische Zahlen-/Headerregeln ergänzt werden. */
  .entities-dt th.col-unit,.entities-dt td.col-unit,
  .entities-dt th.col-rows,.entities-dt td.col-rows{text-align:left!important;}
  .entities-dt th.col-resolution,.entities-dt td.col-resolution,
  .entities-dt th.col-retention,.entities-dt td.col-retention{text-align:right;}
  /* Einfache (einzeilige) Spalten zusätzlich vertikal zentrieren — Entität
     und Erster/Letzter Wert bleiben oben ausgerichtet (vertical-align:top,
     geerbt von table.dt td), weil sie zweizeiligen Inhalt (Name+ID bzw.
     Datum+Uhrzeit) tragen, der oben angeschlagen besser lesbar bleibt. */
  .entities-dt td.va-mid{vertical-align:middle;}
  /* Kein overflow:hidden hier (nur auf .name/.id einzeln, siehe unten) — das
     data-tooltip lebt als ::after-Pseudoelement auf genau diesem <a>
     (position:relative als sein Anker) und würde von overflow:hidden auf
     demselben Element mit abgeschnitten, weil es sich per bottom:calc(100%+…)
     bewusst OBERHALB der eigenen Box positioniert. */
  td.entity a{color:inherit;text-decoration:none;display:block;}
  td.entity a:hover .name{color:var(--accent-line);}
  /* max-width = col-entity(330px) minus Zellpadding (2×14px) — ohne das
     bestimmt bei table-layout:fixed + width:auto trotzdem der ungekürzte
     Inhalt (v. a. die oft sehr lange entity_id im Mono-Font) die tatsächlich
     gerenderte Spaltenbreite, nicht die hier deklarierte .col-entity-Breite
     (Browser fallen für "auto" auf intrinsic/Content-Sizing zurück, sobald
     ein Kind ohne eigene Breitenbegrenzung eine große Mindestbreite meldet).
     Die Spalte selbst kann bei width:100%/proportionaler Streckung (s. o.)
     im Ergebnis breiter sein als 330px — dann bleibt hier zusätzlicher,
     ungenutzter Raum in der Zelle, was unkritisch ist; wichtig ist nur die
     Untergrenze, damit Name/ID nie schmaler abgeschnitten werden als die
     Spalte tatsächlich ist. */
  /* display:flex statt block: die Kürzung (Ellipsis) sitzt jetzt auf dem
     inneren .name-text, damit das Tag-Icon (custom_name-Override, siehe
     _icons.html) als Flex-Geschwister außerhalb von dessen overflow:hidden
     bleibt — sonst würde .name selbst den eigenen data-tooltip des Icons
     mit abschneiden (::after ist ein Nachfahre-Element, overflow:hidden
     clippt unabhängig davon, worauf es positioniert ist). */
  td.entity .name{
    display:flex;align-items:baseline;max-width:302px;font-size:calc(13px * var(--font-scale, 1));font-weight:600;color:var(--ink);
  }
  td.entity .name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  td.entity .id{
    display:block;max-width:302px;font-family:var(--font-mono);font-size:calc(11px * var(--font-scale, 1));color:var(--ink-faint);
    overflow:hidden;text-overflow:ellipsis;cursor:help;
  }
  /* Favoriten-Stern — eigene, schmale Spalte ganz links (keine Sortierung,
     deshalb kein <a> im Header wie bei den übrigen Spalten). Aktiv/inaktiv
     über Füll- vs. Umriss-Zeichen statt einer Farbe allein, damit der
     Zustand auch ohne Farbwahrnehmung erkennbar bleibt. */
  .fav-star{
    background:none;border:none;cursor:pointer;font-size:calc(16px * var(--font-scale, 1));line-height:1;padding:2px;
    color:var(--ink-faint);opacity:.5;
  }
  .fav-star.active{color:#D9A22B;opacity:1;}
  .fav-star:hover{color:#D9A22B;opacity:1;}

  /* Spalten-Auswahl und Typ-Filter nutzen beide das gemeinsame Dropdown-
     Picker-Muster (.dd-picker-*, app.css) statt eigener Optik hier. */
</style>
</head>
<body>
  {% include "_topnav.html" %}
  <div class="page">
    <h1>Entitäten</h1>
    <p class="sub">Alle archivierten Entitäten — durchsuchen, filtern, je Entität zum Verlauf oder zur Konfiguration springen.</p>

    <div class="settings-panel">

        <div id="controls" hx-trigger="load, change from:#controls, keyup delay:300ms from:[name=search]"
             hx-get="entities-table" hx-include="#controls, [name=page_size]" hx-target="#entities-table" hx-swap="innerHTML">
          <input type="search" name="search" placeholder="Entität suchen …" onchange="resetEntitiesPage()">
          <label class="filter-chip"><input type="checkbox" name="favorites" value="true" onchange="resetEntitiesPage()"><span>★ Nur Favoriten</span></label>
          <span id="type-filter-wrap" class="dd-picker-wrap" style="display:{{ 'inline-block' if 'type' in visible_columns else 'none' }};">
            <button type="button" class="btn" id="type-filter-btn" onclick="toggleDDPicker('type-filter')">Typ: Alle ▾</button>
            <div class="dd-picker-popover" id="type-filter-popover">
              <label class="dd-picker-row"><input type="checkbox" name="type" value="all" checked onchange="onTypeAllChange(this); resetEntitiesPage(); updateTypeFilterLabel();"><span>Alle</span></label>
              <label class="dd-picker-row"><input type="checkbox" name="type" value="standard" onchange="onTypeSpecificChange(this); resetEntitiesPage(); updateTypeFilterLabel();"><span>Standard</span></label>
              <label class="dd-picker-row"><input type="checkbox" name="type" value="counter" onchange="onTypeSpecificChange(this); resetEntitiesPage(); updateTypeFilterLabel();"><span>Zähler</span></label>
              <label class="dd-picker-row"><input type="checkbox" name="type" value="switch" onchange="onTypeSpecificChange(this); resetEntitiesPage(); updateTypeFilterLabel();"><span>Schalter</span></label>
            </div>
          </span>
          <span id="unit-filter-wrap" class="dd-picker-wrap" style="display:{{ 'inline-block' if 'unit' in visible_columns else 'none' }};">
            <button type="button" class="btn" id="unit-filter-btn" onclick="toggleDDPicker('unit-filter')">Einheit: Alle ▾</button>
            <input type="hidden" name="unit" id="unit-filter-input" value="all">
            <div class="dd-picker-popover" id="unit-filter-popover">
              <div class="dd-picker-row" onclick="selectDDOption('unit-filter', 'all', 'Alle'); resetEntitiesPage();">Alle Einheiten</div>
              {% for opt in unit_options %}
              <div class="dd-picker-row" onclick="selectDDOption('unit-filter', '{{ opt.value }}', '{{ opt.label }}'); resetEntitiesPage();">{{ opt.label }}</div>
              {% endfor %}
            </div>
          </span>
          <!-- page ist hier die einzige Quelle der Wahrheit für die Seiten-Navigation
               (analog zum offset-field-Muster bei Bereinigung, Abschnitt 04) — der Pager
               im entities-table-Fragment schreibt nur hierhin. -->
          <input type="hidden" name="page" id="page-field" value="1">
          <!-- Unterscheidet "Spalten-Auswahl kam bewusst aus diesem Formular mit"
               von "columns fehlt einfach im Request" (z. B. ein direkter Aufruf von
               /entities-table ohne dieses Feld) — sonst würde Letzteres die
               gespeicherte Auswahl versehentlich auf "keine Spalte sichtbar"
               zurücksetzen, siehe Kommentar bei der Route in main.py. -->
          <input type="hidden" name="columns_submitted" value="1">
          <div class="dd-picker-wrap">
            <button type="button" class="btn" onclick="toggleDDPicker('col-picker')">Spalten ▾</button>
            <div class="dd-picker-popover" id="col-picker-popover">
              {% for key, label in column_options %}
              <label class="dd-picker-row">
                <input type="checkbox" name="columns" value="{{ key }}" {% if key in visible_columns %}checked{% endif %}
                       onchange="onColumnToggle('{{ key }}', this.checked); resetEntitiesPage()">
                <span>{{ label }}</span>
              </label>
              {% endfor %}
            </div>
          </div>
        </div>

        <div id="entities-table"></div>
    </div>
  </div>

  <script src="static/vendor/htmx.min.js"></script>
  <script src="static/js/resizable-tables.js?v={{ js_v }}"></script>
  <script src="static/js/favorite-toggle.js?v={{ js_v }}"></script>
  <script src="static/js/dd-picker.js?v={{ js_v }}"></script>
  <script>
    // Die Liste bleibt beim gewählten sort (kein automatisches Nach-oben-
    // Sortieren von Favoriten, siehe list_entities()) — ein Umschalten ändert
    // also nie die Reihenfolge, kann die Zeile aber aus der aktiven "Nur
    // Favoriten"-Ansicht verschwinden lassen, deshalb hier die ganze Tabelle
    // per htmx neu laden statt nur die Stern-Klasse lokal zu drehen (macht
    // toggleFavorite() in favorite-toggle.js bereits, das reicht für die
    // Optik der geklickten Zeile, aber nicht dafür, sie ggf. auszublenden).
    document.getElementById('entities-table').addEventListener('favorite-changed', () => {
      htmx.trigger('#controls', 'change');
    });
  </script>
  <script>
    // "Alle" und die konkreten Typ-Chips schließen sich gegenseitig aus: "Alle"
    // abwählen ergibt ohne Ersatz keinen Sinn (dann wäre nichts mehr gewählt),
    // umgekehrt hebt jede konkrete Auswahl "Alle" auf. Mehrere konkrete Typen
    // lassen sich gleichzeitig anhaken (Mehrfachauswahl) — läuft synchron im
    // "change"-Event der angeklickten Checkbox, bevor es zu #controls hochblubbert
    // und htmx den Reload auslöst, die DOM-Änderungen sind also rechtzeitig gesetzt.
    function onTypeAllChange(checkbox) {
      if (checkbox.checked) {
        document.querySelectorAll('input[name=type]:not([value=all])').forEach(cb => cb.checked = false);
      } else {
        checkbox.checked = true;
      }
    }
    function onTypeSpecificChange(checkbox) {
      document.querySelector('input[name=type][value=all]').checked = false;
      const anyChecked = Array.from(document.querySelectorAll('input[name=type]:not([value=all])')).some(cb => cb.checked);
      if (!anyChecked) document.querySelector('input[name=type][value=all]').checked = true;
    }

    // page-field ist die einzige Quelle der Wahrheit für die Seiten-Navigation —
    // jeder Control, der die zugrunde liegende Trefferliste ändert (Suche, Typ-
    // Filter, Zeilen/Seite), setzt page zurück auf 1.
    function resetEntitiesPage() {
      document.getElementById('page-field').value = '1';
    }
    function setEntitiesPage(v) {
      const field = document.getElementById('page-field');
      field.value = Math.max(1, v);
      field.dispatchEvent(new Event('change', {bubbles: true}));
    }
    function stepEntitiesPage(delta) {
      const current = parseInt(document.getElementById('page-field').value || '1', 10);
      setEntitiesPage(current + delta);
    }
    function goToEntitiesPage(input) {
      const total = parseInt(input.max || '1', 10);
      let v = parseInt(input.value, 10);
      if (!Number.isFinite(v)) v = 1;
      v = Math.min(Math.max(1, v), total);
      input.value = v;
      setEntitiesPage(v);
    }
  </script>
  <script>
    // Öffnen/Schließen/Auswählen der .dd-picker-Dropdowns (Spalten, Einheit)
    // kommt aus dem gemeinsamen static/js/dd-picker.js (toggleDDPicker/
    // selectDDOption). Der Typ-Filter ist Mehrfachauswahl über Checkboxen
    // und bleibt deshalb eigene Logik — nutzt von dort nur toggleDDPicker()
    // fürs Öffnen/Schließen des Popovers.

    // Button-Beschriftung spiegelt die aktuelle Typ-Auswahl, damit sie ohne
    // geöffnetes Popover erkennbar bleibt (analog zu "Vergleichen"-Button in
    // chart_editor.html, der ebenfalls den aktiven Modus im Label zeigt).
    const TYPE_LABELS = {standard: 'Standard', counter: 'Zähler', switch: 'Schalter'};
    function updateTypeFilterLabel() {
      const checked = Array.from(document.querySelectorAll('input[name=type]:checked'));
      const btn = document.getElementById('type-filter-btn');
      if (!checked.length || checked.some(cb => cb.value === 'all')) {
        btn.textContent = 'Typ: Alle ▾';
        return;
      }
      btn.textContent = 'Typ: ' + checked.map(cb => TYPE_LABELS[cb.value]).join(', ') + ' ▾';
    }

    // Filter, die zu einer gerade ausgeblendeten Spalte gehören (aktuell nur
    // Typ und Einheit), sofort mitausblenden UND zurücksetzen — ein aktiver,
    // aber unsichtbarer Filter wäre sonst verwirrend ("warum fehlen Zeilen,
    // ich sehe doch gar keinen Filter dafür?"). Die eigentliche Spalte selbst
    // holt sich der reguläre htmx-Reload von #controls (change-Trigger),
    // das hier ist nur der Filter-Teil, den htmx nicht mitbekommt (er liegt
    // in #controls selbst, wird also nicht neu vom Server gerendert).
    function onColumnToggle(key, visible) {
      if (key === 'type') {
        document.getElementById('type-filter-wrap').style.display = visible ? 'inline-block' : 'none';
        if (!visible) {
          document.querySelectorAll('input[name=type]').forEach(cb => cb.checked = cb.value === 'all');
          updateTypeFilterLabel();
        }
      }
      if (key === 'unit') {
        document.getElementById('unit-filter-wrap').style.display = visible ? 'inline-block' : 'none';
        if (!visible) {
          document.getElementById('unit-filter-input').value = 'all';
          document.getElementById('unit-filter-btn').textContent = 'Einheit: Alle ▾';
        }
      }
    }
  </script>
</body>
</html>
