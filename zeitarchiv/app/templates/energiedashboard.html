<!doctype html>
<html lang="de" data-color-scheme="{{ color_scheme | default('zeitarchiv') }}" data-color-mode="{{ color_mode | default('auto') }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitarchiv — Energiedashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="static/css/app.css?v={{ css_v }}">
<style>:root{--font-scale:{{ font_scale_value }};}</style>
<style>
  .edash-title-row{display:flex;align-items:center;gap:10px;}
  /* Mobil: die nowrap-Badges drückten den <h1> (word-break:break-word, app.css)
     auf Mindestbreite — "Energiedashboard" brach Buchstabe für Buchstabe um.
     Der Titel behält mindestens 60% der Zeile (der Stift passt daneben), die
     Badges rutschen als eigene Zeile darunter und beginnen links. */
  @media(max-width:560px){
    .edash-title-row{flex-wrap:wrap;row-gap:8px;}
    /* Titel nur so breit wie sein Text, damit der Bearbeiten-Stift direkt
       dahinter bleibt; die ganze Badge-Gruppe (Status+CO2+Kosten, seit
       Status mit hineingezogen wurde — siehe _energiedashboard_view.html)
       bekommt eine eigene Zeile (flex-basis:100%), unabhängig von der
       Titellänge. Kein separates margin-left:auto für Status mehr nötig,
       das gehörte zur alten Position direkt neben dem Titel. */
    .edash-title-row h1{flex:0 1 auto;min-width:0;}
    .edash-title-row .edash-badge-group{flex-basis:100%;}
    /* Höhere Spezifität als die Desktop-Regel .edash-badge-group{margin-left:
       auto} weiter unten — bei gleicher Spezifität gewänne die spätere. */
    .edash-title-row .edash-badge-group{margin-left:0;flex-wrap:wrap;}
    /* Datenqualität-Chip nur als Symbol (✓/!) — der Text passt neben den
       CO2-/Kosten-Badges nicht mehr in eine Zeile. Bedeutung bleibt über
       title/aria-label am Button (_energiedashboard_view.html) erhalten;
       symmetrisches Padding, damit der Chip als runde Marke steht. */
    .edash-quality-badge-text{display:none;}
    .edash-quality-badge{gap:0;padding:6px 11px;}
  }
  .edash-title-edit{color:var(--ink-faint);text-decoration:none;padding:2px;background:none;border:0;cursor:pointer;font-size:calc(15px * var(--font-scale, 1));line-height:1;}
  .edash-title-edit:hover{color:var(--accent-line);}
  /* Status-Badge statt eigener Vollbreite-Kachel für Bilanz & Datenqualität
     — Details öffnen im Popup (.detail-dialog, siehe _energiedashboard_view.html). */
  .edash-quality-badge{
    display:flex;align-items:center;gap:7px;font-family:var(--font-mono);
    font-size:calc(13px * var(--font-scale, 1));font-weight:600;
    padding:6px 13px 6px 11px;border-radius:999px;border:1px solid transparent;
    background:var(--accent-line-soft);color:var(--accent-line);cursor:pointer;
  }
  .edash-quality-badge:hover{border-color:var(--accent-line);}
  .edash-quality-badge.is-warn{background:#F3E4C4;color:#8A6414;}
  /* Rechtsbündige Gruppe für die übrigen Badges — margin-left:auto sitzt auf
     dem GRUPPEN-Container, nicht auf dem ersten Badge darin, damit die
     Rechtsbündigkeit unabhängig davon funktioniert, welche Kombination aus
     CO2-/Kostenanalyse-Badge gerade per Toggle sichtbar ist. */
  .edash-badge-group{display:flex;align-items:center;gap:8px;margin-left:auto;}
  /* CO2-Badge: wirklich neutral (Grau über --ink-muted/--surface-alt) — mit
     --accent-line war es *trotzdem* grün, weil --accent-line im Standard-
     Schema selbst ein Teal/Grün-Ton ist (#0C6B5D), keine echte neutrale
     Farbe. Grün wäre hier ohnehin nicht datengetrieben (die Badge zeigt
     immer "Vermiedenes CO2", eine per Definition immer positive Zahl, kein
     Umschlagen zwischen zwei Zuständen wie bei Kostenanalyse/
     Netzenergiebilanz), das 🌱-Icon trägt die CO2-Bedeutung schon allein. */
  .edash-co2-badge{
    display:flex;align-items:center;gap:7px;font-family:var(--font-mono);
    font-size:calc(13px * var(--font-scale, 1));font-weight:600;
    padding:6px 13px 6px 11px;border-radius:999px;border:1px solid transparent;
    background:var(--surface-alt);color:var(--ink-muted);cursor:pointer;
  }
  .edash-co2-badge:hover{border-color:var(--border-strong);}
  /* Kostenanalyse-Badge: Farbe nach Vorzeichen des Saldo — Default (Saldo
     positiv, mehr Netzbezug-Kosten) = --danger/rot, .is-surplus (Saldo
     negativ, Einspeisung-Erlös überwiegt) = --positive/grün. Dieselbe
     Rot/Grün-Logik wie die Netzenergiebilanz (kostet dich vs. lohnt sich),
     nicht die neutrale --accent-bar-Rollenfarbe. */
  .edash-cost-badge{
    display:flex;align-items:center;gap:7px;font-family:var(--font-mono);
    font-size:calc(13px * var(--font-scale, 1));font-weight:600;
    padding:6px 13px 6px 11px;border-radius:999px;border:1px solid transparent;
    background:color-mix(in srgb, var(--danger) 16%, var(--surface));
    color:var(--danger);cursor:pointer;
  }
  .edash-cost-badge:hover{border-color:var(--danger);}
  .edash-cost-badge.is-surplus{
    background:color-mix(in srgb, var(--positive) 16%, var(--surface));
    color:var(--positive);
  }
  .edash-cost-badge.is-surplus:hover{border-color:var(--positive);}

  .edash-setup-cta{
    border:1px dashed var(--border-strong);border-radius:14px;background:var(--surface);
    padding:36px 24px;text-align:center;margin-top:20px;
  }
  .edash-setup-cta p{color:var(--ink-muted);font-size:calc(13.5px * var(--font-scale, 1));max-width:52ch;margin:8px auto 18px;}

  .edash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px;}
  .edash-card{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px 18px;min-width:0;}
  .edash-card.edash-span3{grid-column:span 3;}
  .edash-card.edash-span2{grid-column:span 2;}
  .edash-card.edash-ring-card{grid-column:span 1;}
  .edash-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .edash-card-title{font-weight:600;font-size:calc(14px * var(--font-scale, 1));}
  .edash-card-title .n{color:var(--ink-faint);font-weight:500;font-size:calc(12px * var(--font-scale, 1));margin-left:6px;}
  /* Aktueller Speicher-Füllstand im Kachel-Kopf der Autarkie & Speicher-
     Karte — unabhängig von Tag/Monat/Jahr, daher bewusst NICHT bei den
     Ringen (die den Ø über die gewählte Periode zeigen), sondern oben neben
     dem Titel, wo es klar als "immer aktuell" statt "diese Periode" liest. */
  .edash-soc-now{display:flex;align-items:center;gap:5px;font-size:calc(11.5px * var(--font-scale, 1));color:var(--ink-muted);white-space:nowrap;}
  .edash-soc-now strong{color:var(--ink);font-weight:600;}
  .edash-soc-now-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--chart-4);flex:none;}
  @media(max-width:820px){.edash-grid{grid-template-columns:repeat(2,1fr);}.edash-card.edash-span3,.edash-card.edash-ring-card{grid-column:span 2;}}
  @media(max-width:560px){.edash-grid{grid-template-columns:1fr;}.edash-card.edash-span3,.edash-card.edash-span2,.edash-card.edash-ring-card{grid-column:span 1;}}

  /* Wrapper für Perioden-Pills + Pfeil-Navigation (vorher Inline-Style) —
     als eigene Klasse, damit die mobile Regel unten ihn zentrieren kann. */
  .edash-period-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  /* Mobil: die Steuerelemente stehen unter dem Kachel-Titel in eigener
     Zeile(n) — dort zentriert statt linksbündig "angeklebt". Der Wrapper
     nimmt die volle Breite (das Umbrechen von .edash-card-head trennt ihn
     ohnehin vom Titel), Pills und Navigation zentrieren sich darin je
     einzeln, weil beide zusammen (~250px + ~270px) nicht in eine Zeile
     passen und sonst nur die erste Zeile mittig säße. */
  @media(max-width:560px){
    .edash-period-controls{flex:1 1 100%;justify-content:center;}
    .edash-period-nav{flex:1 1 100%;justify-content:center;}
  }
  .edash-period-pills{display:flex;align-items:center;gap:4px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .edash-period-pills button{font-family:var(--font-mono);font-size:calc(11.5px * var(--font-scale, 1));padding:5px 10px;border-radius:6px;border:0;background:transparent;color:var(--ink-faint);cursor:pointer;}
  .edash-period-pills button.is-active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600;}
  .edash-period-nav{display:flex;align-items:center;gap:8px;font-size:calc(12.5px * var(--font-scale, 1));color:var(--ink-muted);}
  .edash-period-nav button{width:22px;height:22px;flex:none;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink-faint);cursor:pointer;line-height:1;}
  .edash-period-nav button:disabled{opacity:.4;cursor:default;}
  /* Feste Breite für das Perioden-Label: "27.08.2026 · 14:00–15:00 Uhr"
     (Stunde) ist deutlich länger als "September 2026" (Monat) oder "2026"
     (Jahr) — ohne Mindestbreite verschob sich beim Umschalten die gesamte
     rechtsbündige Werkzeugleiste (Perioden-Pills/Pfeile/Bearbeiten-Stift)
     sichtbar hin und her, weil .edash-card-head sie per
     justify-content:space-between am rechten Rand verankert. */
  .edash-period-nav-label{min-width:210px;text-align:center;font-variant-numeric:tabular-nums;}
  /* Energiebericht-Link (ROADMAP.md 1.7) — dieselbe kleine Quadrat-Button-
     Optik wie die ‹/›-Pfeile in .edash-period-nav nebenan, aber ein eigenes
     <a target="_blank">, kein <button>, da er eine eigenständige Seite in
     neuem Tab öffnet statt eine Aktion auf DIESER Seite auszulösen. */
  .edash-report-btn{
    width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink-faint);
    cursor:pointer;text-decoration:none;
  }
  .edash-report-btn:hover{color:var(--accent-line);border-color:var(--accent-line);}

  /* Autarkiegrad/Eigenverbrauchsquote/Speicher-SOC als Ring-Gauges — SVG-
     Technik (Kreis + zweiter Kreis mit stroke-dasharray/-dashoffset als
     Fortschrittsring) 1:1 aus dem ursprünglichen Mockup übernommen, Offset
     serverseitig nicht verfügbar (reiner Anzeigewert) → ringOffset() in
     energiedashboard.js berechnet ihn aus dem Prozentwert. stroke-dasharray
     263,894 = 2·π·42 (Radius des Kreises), bei r=42 daher fix statt aus
     Alpine gebunden. Fortschritts-Kreis läuft über ein <linearGradient> statt
     einer flachen Füllfarbe (von 45% Deckkraft zu voller Deckkraft derselben
     Farbe — bleibt dadurch klar der jeweiligen Kennzahl zuordenbar statt
     einen zweiten, nicht codierten Farbton einzuführen). Eigene, kompakte
     Kachel statt eines Bereichs neben Donut/Tabelle. Feste (statt flexible)
     Item-Breite, damit in der Kachel-Breite immer genau 2 pro Zeile passen
     (nicht 3 oder 1) — der dritte Ring rutscht dadurch zuverlässig in eine
     zweite Zeile, die justify-content:center dort für sich genommen wieder
     zentriert (jede umgebrochene Flex-Zeile zentriert sich unabhängig).
     Schrift im selben Verhältnis mitvergrößert. */
  .edash-ring-panel{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;row-gap:18px;}
  .edash-ring-item{flex:0 0 auto;width:132px;}
  .edash-ring-clickable{cursor:pointer;border-radius:12px;transition:background-color .15s ease,transform .15s ease;}
  .edash-ring-clickable:hover{background:var(--surface-alt);transform:translateY(-2px);}
  .edash-ring-svg{width:100%;height:auto;}
  .edash-ring-num{font-family:var(--font-mono);font-size:calc(13px * var(--font-scale, 1));font-weight:700;fill:var(--ink);}
  /* Etwas kleiner + engerer Letter-Spacing als zuvor (8px/.02em) — die
     längsten Labels ("EIGENVERBRAUCH", "WIRKUNGSGRAD") liefen sonst fast bis
     an den Ring heran statt sauber innerhalb zu bleiben. */
  .edash-ring-sub{font-size:calc(6.8px * var(--font-scale, 1));fill:var(--ink-faint);text-transform:uppercase;letter-spacing:.01em;}

  /* PV-Prognose: schmale Info-Zeile über der KPI-Reihe, kein eigenes Badge
     im Titel-Kopf (der hat mit Datenqualität/CO2/Kostenanalyse schon genug
     Kandidaten) — bewusst neutral/dezent, keine Statusfarbe, da es keinen
     guten/schlechten Zustand gibt, nur eine Zahl. */
  /* Hero-Leiste: bündelt Autarkie/CO2/Kostensaldo (sonst nur als Ring bzw.
     Popup-Badges sichtbar) mit der bisherigen Live-Prognose-Zeile zu EINER
     Zeile — ein Blick genügt, statt erst zu Ringen/Badges wandern zu müssen.
     Dezenter Verlauf (Akzentfarbe → Kartenweiß) statt eines flachen Rands,
     damit die Zeile sich als eigenes Element vom Rest der Karte abhebt, ohne
     eine weitere volle Kachel zu sein. Vertikale Trennstriche statt Kommas
     zwischen den Werten — bei unterschiedlich vielen sichtbaren Items
     (x-show je nach Datenlage) bleibt die Zeile so immer sauber lesbar. */
  .edash-hero{
    display:flex;align-items:center;flex-wrap:wrap;
    background:linear-gradient(90deg, var(--accent-line-soft), var(--surface) 70%);
    border:1px solid var(--border);border-radius:10px;padding:8px 4px;margin:2px 0 14px;
  }
  .edash-hero-item{display:flex;align-items:center;gap:6px;padding:4px 14px;white-space:nowrap;font-size:calc(12px * var(--font-scale, 1));color:var(--ink-muted);}
  .edash-hero-item + .edash-hero-item{border-left:1px solid var(--border-strong);}
  .edash-hero-item svg{flex:none;}
  .edash-hero-item strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .edash-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:16px;align-items:stretch;}
  /* Flex-Spalte statt gestapelter Blöcke: die Speicher-Kachel hat mit der
     zusätzlichen Ladezustand-Zeile (.edash-kpi-sub) eine Zeile mehr als die
     übrigen Kacheln — ohne margin-top:auto auf der Sparkline (unten) läge
     ihre Sparkline dadurch höher als bei den anderen Kacheln in derselben
     Reihe. .edash-kpi-row streckt alle Kacheln per Grid schon auf dieselbe
     Höhe, hier wird nur noch der freie Rest nach unten an die Sparkline
     verteilt. */
  .edash-kpi{
    position:relative;border:1px solid var(--border);border-radius:9px;background:var(--surface-alt);
    padding:10px 12px 8px;overflow:hidden;display:flex;flex-direction:column;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
  }
  /* Dieselbe Hover-Reaktion wie die Ringe darunter und die Rollen-Kacheln im
     Setup — einheitliche Mikro-Interaktion statt nur an einer Stelle der
     App. Kein Klickziel-Anspruch (nicht alle Kacheln sind klickbar), rein
     als "die Seite reagiert" wahrgenommen. */
  .edash-kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(19,28,23,.09);border-color:var(--border-strong);}
  /* overflow:hidden oben ist für die Sparkline in der Energiefluss-Zeile
     nötig, schneidet aber den [data-tooltip]::after-Ballon ab, wenn ein
     Tooltip auf der ganzen Kachel sitzt (Kostenanalyse-Kacheln haben keine
     Sparkline und brauchen das Clipping nicht). */
  .edash-kpi.has-tooltip{overflow:visible;}
  /* Farbiger Akzentbalken oben, dieselbe Rollenfarbe wie der zugehörige
     Sankey-Knoten (colorForNode() in energiedashboard.js) — macht die
     KPI-Zeile auf einen Blick den Farben im Fluss darunter zuordenbar, statt
     fünf optisch gleiche graue Kacheln zu zeigen. Nur in der Energiefluss-
     Zeile gesetzt (.edash-kpi-accent existiert nur dort im Markup), die
     übrigen .edash-kpi (Kosten-/CO2-Popups) bleiben unverändert ohne Balken. */
  .edash-kpi-accent{position:absolute;top:0;left:0;right:0;height:3px;}
  .edash-kpi-head{display:flex;align-items:center;gap:6px;}
  .edash-kpi-icon{flex:none;display:flex;}
  .edash-kpi-label{font-size:calc(10.5px * var(--font-scale, 1));color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .edash-kpi-val{font-family:var(--font-mono);font-size:calc(17px * var(--font-scale, 1));font-weight:600;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums;}
  .edash-kpi-val small{font-size:calc(11px * var(--font-scale, 1));color:var(--ink-muted);font-weight:500;}
  /* Ladezustand (Speicher-Kachel) als eigene Zeile statt an den kWh-Wert
     angehängt — sonst brach die Zeile bei aktivierter Kapazität ("−0,2 kWh ·
     54 % (1,1 kWh)") mitten im Wert um und wirkte gedrängt/uneinheitlich
     gegenüber den anderen, einzeiligen Kacheln. */
  .edash-kpi-sub{font-size:calc(10.5px * var(--font-scale, 1));color:var(--ink-muted);margin-top:2px;font-variant-numeric:tabular-nums;}
  .edash-kpi-delta{font-size:calc(10.5px * var(--font-scale, 1));color:var(--ink-faint);margin-top:2px;font-variant-numeric:tabular-nums;}
  /* margin-top:auto schiebt die Sparkline an den unteren Rand der (per
     .edash-kpi-row/align-items:stretch schon gleich hohen) Kachel — dadurch
     stehen alle Sparklines einer Reihe auf gleicher Höhe, unabhängig davon,
     wie viele Textzeilen eine einzelne Kachel darüber hat (z. B. die
     Speicher-Kachel mit ihrer zusätzlichen Ladezustand-Zeile). */
  .edash-kpi-spark{margin-top:auto;}
  .edash-kpi .sparkline{height:18px;margin-top:5px;display:block;}
  /* Platzhalter statt einer echten Linie, wenn noch keine 2 Datenpunkte
     vorliegen (z. B. am 1. eines laufenden Monats) — dieselbe Höhe wie eine
     echte Sparkline, damit die Kachel nicht kürzer wirkt als ihre Nachbarn. */
  .edash-kpi .sparkline.is-placeholder line{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:2 3;}

  /* Netzenergiebilanz: divergierender Balken (Referenz-Screenshot des
     Nutzers) — Füllung startet an der Mitte (0) und wächst nach rechts
     (Netto-Bezug, --chart-1 wie Netzbezug im Sankey) oder links (Netto-
     Einspeisung, --chart-2 wie Einspeisung im Sankey), Skala/Position
     werden per netBalanceFillStyle() in energiedashboard.js berechnet. */
  .edash-netbalance{margin:2px 0 14px;}
  .edash-netbalance-label{font-size:calc(12px * var(--font-scale, 1));color:var(--ink-muted);margin-bottom:6px;font-variant-numeric:tabular-nums;}
  .edash-netbalance-label strong{color:var(--ink);font-weight:600;}
  .edash-netbalance-track{position:relative;height:10px;border-radius:5px;background:var(--surface-alt);overflow:hidden;}
  /* Sanfter Übergang beim Periodenwechsel (Tag/Monat/Jahr, Vor/Zurück) statt
     eines harten Sprungs — left UND width animieren, weil sich bei einem
     Vorzeichenwechsel (Bezug <-> Einspeisung) beide gleichzeitig ändern. */
  .edash-netbalance-fill{position:absolute;top:0;height:100%;transition:left .35s ease,width .35s ease;}
  /* Bewusst NICHT --chart-1/--chart-2 (Netzbezug/Einspeisung-Farbe im Sankey)
     — hier geht es um eine Bewertung (kostet dich vs. bringt dir was), nicht
     um die 5-Wege-Rollenunterscheidung. --danger/--positive sind dediziert
     semantisch (rot=schlecht/kostet, grün=gut/lohnt sich) und in allen
     Farbschemata konsistent, anders als die neutralen chart-Tokens.
     Radius nur am äußeren Ende (weg von der Mitte) — die Seite, die an den
     Trenner-Strich stößt, bleibt eckig, damit Balken und Trenner sauber
     aneinander abschließen statt einer Lücke durch die Rundung. Farbverlauf
     blass an der Mitte auslaufend zum äußeren Ende hin kräftig — je weiter
     weg vom Vergleichspunkt (Trenner-Strich), desto stärker die Aussage —
     per color-mix() — dieselbe Technik wie die Bereichs-Einfärbung im
     Setup-Formular. */
  .edash-netbalance-fill.is-import{
    border-radius:0 5px 5px 0;
    background:linear-gradient(to right, color-mix(in srgb, var(--danger) 45%, var(--surface-alt)), var(--danger));
  }
  .edash-netbalance-fill.is-export{
    border-radius:5px 0 0 5px;
    background:linear-gradient(to right, var(--positive), color-mix(in srgb, var(--positive) 45%, var(--surface-alt)));
  }
  .edash-netbalance-divider{position:absolute;left:50%;top:-2px;bottom:-2px;width:1.5px;background:var(--ink);transform:translateX(-0.75px);z-index:1;}
  /* Enden-Beschriftung, damit "welche Seite ist was" nicht allein über die
     Farbe (Rollen-Legende auswendig kennen) erschlossen werden muss. */
  .edash-netbalance-ends{display:flex;justify-content:space-between;margin-top:4px;font-size:calc(10.5px * var(--font-scale, 1));color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}

  /* Kaum wahrnehmbarer Verlauf (Quellfarbe oben-links, Netzfarbe unten-
     rechts, je 5% Deckkraft) statt reinem Kartenweiß hinter dem Sankey —
     nur auf der Energiefluss-Karte (.edash-flow-card), NICHT auf
     .edash-span3 allgemein, das auch die Tageslastprofil-Karte trägt. */
  .edash-flow-card{
    background:
      radial-gradient(140% 100% at 0% 0%, color-mix(in srgb, var(--chart-3) 5%, transparent), transparent 55%),
      radial-gradient(140% 100% at 100% 100%, color-mix(in srgb, var(--chart-1) 5%, transparent), transparent 55%),
      var(--surface);
  }
  .edash-sankey-wrap{height:420px;}
  /* Vertikale Sankey-Orientierung (siehe renderChart() in energiedashboard.js,
     unter demselben 560px-Breakpoint) braucht mehr Höhe — Quellen/Bus/
     Verbraucher stehen dort übereinander statt nebeneinander. */
  @media(max-width:560px){.edash-sankey-wrap{height:560px;}}
  .edash-sankey-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-faint);font-size:calc(12.5px * var(--font-scale, 1));}

  /* center statt flex-start: die Auffälligkeiten-Zeile hat bei Treffern nur
     EINE Textzeile (kein Hinweistext darunter, siehe x-show unten) — mit
     flex-start hing das Icon dann sichtbar oben, statt zur Zeile
     zentriert zu stehen. Bei den zweizeiligen Titel+Hinweis-Zeilen (Bilanz/
     Datenqualität) bleibt center genauso stimmig. */
  .edash-quality-row{display:flex;gap:10px;align-items:center;}
  .edash-quality-icon{width:30px;height:30px;border-radius:8px;background:var(--accent-line-soft);color:var(--accent-line);display:flex;align-items:center;justify-content:center;flex:none;font-size:calc(15px * var(--font-scale, 1));}
  .edash-quality-row.is-warn .edash-quality-icon{background:#F3E4C4;color:#8A6414;}
  .edash-quality-row strong{font-size:calc(13px * var(--font-scale, 1));display:block;margin-bottom:3px;}
  /* Immer beide Prüfungen zeigen (nicht nur bei Problemen, siehe Kommentar
     in compute_flow()) — je Zeile ein eigenes ✓/!-Symbol statt eines
     pauschalen ::before-Häkchens, da einzelne Prüfungen fehlschlagen können,
     während die Kachel insgesamt trotzdem weiterläuft. */
  .edash-quality-list{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px;}
  /* Auffälligkeiten-Zeile folgt auf die Prüfungsliste (statt wie die übrigen
     .edash-quality-row auf eine andere .edash-quality-row) — ohne diese
     Regel hätte sie keinerlei Abstand/Trennlinie zur Liste darüber und
     wirkte wie ein weiterer Listeneintrag statt eines eigenen Abschnitts. */
  .edash-quality-list + .edash-quality-row{margin-top:14px;padding-top:10px;border-top:1px solid var(--border);}
  .edash-quality-list li{font-size:calc(11.5px * var(--font-scale, 1));color:var(--ink-muted);display:flex;align-items:baseline;gap:7px;}
  .edash-quality-check-icon{flex:none;color:var(--chart-6);font-weight:700;}
  .edash-quality-list li.is-warn .edash-quality-check-icon{color:#8A6414;}
  .edash-quality-list li.is-warn{color:var(--ink);}

  /* Bilanz-Anteilsbalken: erfasste Verbraucher vs. Grundlast, als einfacher
     gefüllter Pill-Balken statt eines echten divergierenden Diagramms (kein
     serverseitiges "Quellen-Summe/Senken-Summe" nötig — reine
     Anteilsdarstellung der ohnehin schon vorhandenen Grundlast-share aus
     verbraucherBreakdown). Bilanz und Datenqualität teilen sich EINE Kachel
     (platzsparender als zwei Karten) — der Balken bekommt hier zusätzlich
     einen unteren Rahmen/Innenabstand, der als Trenner zur nachfolgenden
     Datenqualität-Zeile dient, da ein reiner CSS-Nachbarselektor auf
     .edash-quality-row den dazwischenliegenden Balken nicht überspringen
     würde. */
  .edash-balance-bar{margin:8px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .edash-balance-bar-track{height:8px;border-radius:5px;background:var(--border-strong);overflow:hidden;}
  .edash-balance-bar-fill{height:100%;background:var(--accent-line);border-radius:5px 0 0 5px;}
  .edash-balance-bar-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:calc(11.5px * var(--font-scale, 1));color:var(--ink-muted);}
  .edash-balance-bar-legend strong{color:var(--ink);font-weight:600;}
  .edash-balance-dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle;}
  .edash-balance-dot.is-tracked{background:var(--accent-line);}
  .edash-balance-dot.is-grundlast{background:var(--border-strong);}

  /* Tageslastprofil-Heatmap: als ECharts-heatmap-Serie statt eigenem
     HTML/CSS-Grid — dieselbe Bibliothek/Instanz-Lebenszyklus wie Sankey und
     Donut auf dieser Seite, dadurch automatisch derselbe Tooltip-Look
     (Farbe/Radius/Schatten) statt eines optisch abweichenden nativen
     title-Attributs. Feste, eher knappe Höhe ("ein Tick kleiner" als der
     erste Entwurf mit dem HTML-Grid). */
  .edash-heatmap-wrap{height:200px;}

  /* Verbraucheranteile: dieselbe Gestaltung wie "Speichernutzung" in
     statistik.html — Donut (ECharts) links, Tabelle rechts als Legende
     (kein separates Legenden-Element, dieselbe Begründung wie dort: die
     Tabelle zeigt Farbpunkt/Name/kWh/Anteil ohnehin schon vollständig).
     Tabellenzeile ↔ Donut-Segment sind über highlightShare()/
     unhighlightShare() (energiedashboard.js) verbunden, exakt wie dort
     über dispatchAction('highlight'/'downplay'). */
  /* 18px = dieselbe horizontale Kachel-Innenabstand wie .edash-card padding
     — Donut-zu-Tabelle-Abstand entsprach vorher nicht dem Abstand zwischen
     Donut und Kachel-Rand (32px vs. 18px), wirkte dadurch unausgewogen. */
  .edash-share-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
  .edash-share-donut{flex:0 0 220px;width:220px;height:220px;}
  .edash-share-wrap .tbl-wrap{flex:1;min-width:280px;}
  .edash-share-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:middle;flex:none;}
  /* Wie .storage-category-link in statistik.html: kein Farb-Override, nur
     fett — Verbraucher mit Entität sind anklickbar (öffnet entities/…),
     Grundlast bleibt reiner Text ohne Link. */
  .edash-share-link{font-weight:600;color:inherit;}
  /* white-space:nowrap zusätzlich zum bestehenden text-align:right — ohne
     das brach "100 %"/Währungswerte bei schmalerer Kartenbreite (z. B. mit
     der neuen Kosten-Spalte) mitten im Wert auf zwei Zeilen um, während die
     Beschriftungsspalte noch reichlich Platz hatte. */
  .edash-share-table th:nth-child(2),.edash-share-table th:nth-child(3),.edash-share-table th:nth-child(4),
  .edash-share-table td:nth-child(2),.edash-share-table td:nth-child(3),.edash-share-table td:nth-child(4){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* Mobil: flex-basis (220px) ausschalten, sonst gewinnt sie gegen
     width:100% und der Donut hängt 220px breit links in der Kachel. Als
     zentrierter Block mit 260px (dieselbe Größe wie #storage-pie in
     statistik.html) oberhalb der Tabelle. */
  @media(max-width:560px){
    .edash-share-wrap{flex-direction:column;align-items:stretch;}
    .edash-share-donut{flex:0 0 auto;width:100%;max-width:260px;height:260px;margin:0 auto;}
    .edash-share-wrap .tbl-wrap{min-width:0;width:100%;}
  }

  /* Setup-Formular orientiert sich bewusst am Bereich "Einstellungen"
     (settings.html): echte .settings-section/.field/.actionbar-Klassen aus
     app.css statt eigener Kartenoptik — dieselbe Typografie, derselbe
     Kartenrahmen, dieselbe Zwischenraum-Konvention (margin-top statt
     Trennlinie zwischen den Bereichen). .edash-field-grid bleibt die einzige
     Ergänzung: mehrere .field nebeneinander statt gestapelt, mit fester
     Spalten-Maximalbreite (260px), damit einzelne Felder bei der vollen
     Seitenbreite (.page, 1120px) nicht unschön in die Länge gezogen werden —
     mehr Platz erzeugt so mehr Spalten pro Reihe statt breiterer Felder. */
  .edash-field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,260px));gap:4px 14px;}
  /* Kachel-Sichtbarkeits-Checkboxen (Allgemein) — kompakte Flow-Liste statt
     Grid-Feld, da hier keine Breitenabstimmung mit Entitäts-Feldern nötig
     ist, nur eine Reihe einzeiliger Checkbox+Label-Paare. */
  .edash-toggle-list{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px;}
  .edash-toggle-row{display:flex;align-items:center;gap:7px;font-size:calc(13px * var(--font-scale, 1));color:var(--ink);cursor:pointer;}
  .edash-toggle-row input[type="checkbox"]{margin:0;cursor:pointer;}
  .edash-field-grid .field .dd-picker-wrap,
  .edash-item-dialog .field .dd-picker-wrap{width:100%;}
  /* overflow/text-overflow/white-space fehlten hier — ein langer Friendly-
     Name lief dadurch unter den absolut positionierten "✕"-Leeren-Button und
     wirkte "abgeschnitten/überlappend" statt sauber mit … zu enden. Dasselbe
     Dreiergespann wie beim etablierten .dtile-entity-picker>.btn. Gilt auch
     für die Einzelrollen-Popups (.edash-item-dialog) — dieselbe Feldbreite
     wie im Setup-Formular selbst, unabhängig davon ob ein Popup ein oder
     mehrere Felder hat (.edash-dialog-fields-Wrapper optional). */
  .edash-field-grid .field .dd-picker-wrap .btn,
  .edash-item-dialog .field .dd-picker-wrap .btn{
    width:100%;text-align:left;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  /* Textfelder hatten keine eigene Breitenregel und fielen auf die
     Browser-Standardbreite eines <input> zurück (~150px) — sichtbar
     schmaler als die auf 100% gestreckten Entitäts-Auswahlfelder in
     derselben Spalte. Jetzt beide gleich breit wie die Spalte/das Feld. */
  .edash-field-grid .field input[type="text"],
  .edash-item-dialog .field input[type="text"]{width:100%;box-sizing:border-box;}
  /* Dropdown-Popover war fest 220px breit und rechtsbündig positioniert
     (Standardverhalten aus app.css) — bei einer bis zu 260px breiten Spalte
     bzw. einem schmalen Popup passte das weder in der Breite noch in der
     Ausrichtung zum Feld darüber. Dasselbe Muster wie
     .dtile-entity-picker>.dd-picker-popover in app.css: volle Breite,
     linksbündig statt rechtsbündig. */
  .edash-field-grid .dd-picker-popover,
  .edash-item-dialog .dd-picker-popover{left:0;right:auto;width:100%;box-sizing:border-box;}
  /* Fester-Wert-Fallback (Kosten/CO2/Speicher-Kapazität) sitzt als weiteres
     Kind IM selben Span wie der Entitäts-Button (siehe den call-Block um
     entity_field in _energiedashboard_setup.html) — dadurch kann er per
     x-show="!entityId" auf den Picker-Zustand reagieren. Ohne eigenen
     Abstand würde er direkt unter dem Button kleben, da beide nur per
     erzwungenem Zeilenumbruch (width:100% auf dem Button) untereinander
     landen. .edash-unit-input ist jetzt der direkte Kind-Span (statt des
     Inputs selbst) — das Feld hat seit der Einheiten-Suffix-Ergänzung
     (siehe unten) eine Wrapper-Ebene mehr. */
  .dd-picker-wrap > .edash-unit-input{margin-top:6px;}
  /* Einheiten-Suffix im Eingabefeld (z. B. "29  Ct/kWh") statt nur im
     Hinweistext darunter — bleibt auch sichtbar, wenn der Hinweistext
     überlesen wird. Rahmen/Hintergrund sitzen jetzt auf dem Wrapper, das
     Input-Element selbst wird rahmenlos/transparent, damit sich beides wie
     EIN Feld liest statt wie Eingabe + separates Label daneben. */
  .edash-unit-input{
    display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px;
  }
  .edash-unit-input:focus-within{border-color:var(--accent-line);}
  /* .field statt nur .edash-unit-input als Vorsatz — sonst verliert border:
     none gegen das app-weite .field input[type="text"] (app.css), das mit
     einem Typ-Selektor (input) eine Stufe höher spezifisch ist als zwei
     Klassen allein. Ohne diesen Fix behielt der <input> seinen eigenen
     Rahmen UNTER dem des Wrappers — sah wie zwei verschachtelte Boxen statt
     einem einzigen Feld "2  kWh" aus. */
  .field .edash-unit-input .edash-fixed-price-input{
    flex:1;min-width:0;border:none;background:none;padding:8px 0;
    font-family:var(--font-mono);font-size:calc(13px * var(--font-scale, 1));color:var(--ink);
  }
  .field .edash-unit-input .edash-fixed-price-input:focus{outline:none;}
  .edash-unit-suffix{flex:none;font-family:var(--font-mono);font-size:calc(12px * var(--font-scale, 1));color:var(--ink-faint);}

  /* dd-picker-anchor: eigener position:relative-Anker NUR für Button/✕/
     Popover innerhalb von entity_field (siehe _energiedashboard_setup.html)
     — der "✕"-Leeren-Button und das Popover sind position:absolute relativ
     zum nächsten positionierten Vorfahren; ohne eigene Regeln hier verhält
     sich der Anker wie ein stilloses <span> (display:inline), das sowohl
     .dd-picker-wrap > .btn{background:...} (app.css, direkter-Kind-
     Selektor, greift durch den Zwischen-Anker nicht mehr) als auch die
     100%-Breite bricht. display:block;width:100% repliziert exakt das
     frühere Verhalten von .dd-picker-wrap selbst (bevor der Anker
     eingeführt wurde). */
  .dd-picker-anchor{position:relative;display:block;width:100%;}
  .dd-picker-anchor > .btn{background:var(--surface);}
  .dd-picker-anchor > .btn:hover:not(:disabled){background:var(--surface-alt);}

  /* dd-picker-wrap-inline (entity_field(..., inline_fallback=true)): Zahl+
     Einheit-Fallback (Kosten/CO2/Speicher-Kapazität) NEBEN statt UNTER dem
     Auswahl-Button — als eine kurze Zahl+Einheit wirkte er als eigene volle
     Zeile darunter wie ein zweites, unabhängiges Feld statt eines
     Fallback-Wegs für dasselbe Feld. Der Anker (statt früher der Button
     direkt) verliert dafür seine erzwungene 100%-Breite und teilt sich die
     Zeile per flex:1 mit dem kompakten, nicht wachsenden Zahlenfeld —
     flex-wrap:wrap als Rückfalloption für sehr schmale Popups. */
  .field .dd-picker-wrap-inline{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .field .dd-picker-wrap-inline > .dd-picker-anchor{width:auto;flex:1 1 140px;}
  .dd-picker-wrap-inline > .edash-unit-input{width:auto;flex:none;margin-top:0;}

  /* Eigenes Ziehen-Handle statt der ganzen Kachel draggable — sonst würde ein
     Klick auf die Kachel (öffnet das Popup) einen Browser-Drag statt eines
     Klicks auslösen. Reordering selbst läuft rein in Alpine (Array-Splice),
     kein natives HTML5-Drag&Drop-Backend nötig, weil hier kein separater
     Persistenz-Request existiert — die neue Reihenfolge geht beim normalen
     Speichern einfach als Formular-Feldreihenfolge mit. */
  .edash-drag-handle{
    flex:none;width:16px;height:16px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-faint);cursor:grab;font-size:calc(12px * var(--font-scale, 1));line-height:1;
    touch-action:none;
  }
  .edash-drag-handle:active{cursor:grabbing;}

  /* Bereichs-Einfärbung passend zur Rollen-Farblegende ("04 Datenquellen" im
     Mockup, vom Nutzer nochmal explizit als Referenz-Screenshot bestätigt):
     Netzbezug=--chart-1, Netzeinspeisung=--chart-2, Erzeuger=--chart-3,
     Speicher=--chart-4, Verbraucher=--chart-7 — dieselben Tokens, die auch
     colorForNode() im Sankey verwendet (energiedashboard.js), damit Sankey-
     Farbe und Konfig-Bereich zusammenpassen. "Netz" fasst Netzbezug UND
     Einspeisung in einem Formularbereich zusammen und wird daher einfarbig
     nach der Pflichtrolle (Netzbezug/--chart-1) eingefärbt. Allgemein und
     Kosten bleiben bewusst ungefärbt — keine natürliche Rollen-Farbe. 8%/32%
     statt vorher 5%/25%, weil die schwächere Tönung im Browser kaum als
     Farbe wahrnehmbar war, eher wie ein Rendering-Unterschied wirkte. */
  .edash-section-netz{background:color-mix(in srgb, var(--chart-1) 8%, var(--surface));border-color:color-mix(in srgb, var(--chart-1) 32%, var(--border));}
  .edash-section-erzeuger{background:color-mix(in srgb, var(--chart-3) 8%, var(--surface));border-color:color-mix(in srgb, var(--chart-3) 32%, var(--border));}
  .edash-section-speicher{background:color-mix(in srgb, var(--chart-4) 8%, var(--surface));border-color:color-mix(in srgb, var(--chart-4) 32%, var(--border));}
  .edash-section-verbraucher{background:color-mix(in srgb, var(--chart-7) 8%, var(--surface));border-color:color-mix(in srgb, var(--chart-7) 32%, var(--border));}

  /* Rollen-Kacheln: eine Kachel pro Einzeleintrag (Netzbezug/Einspeisung
     fix, Erzeuger/Speicher/Verbraucher dynamisch) statt einer Formularzeile
     — Grundriss/Optik bewusst am "Neues Dashboard hinzufügen"-Muster von
     /dashboards orientiert (Kachel-Raster, gestrichelte Hinzufügen-Kachel),
     Farbakzent oben je Kachel identisch zu .edash-section-* (Sankey-Rollen-
     farbe), damit Bereichs- und Kachelfarbe sich verstärken statt zu
     kollidieren. auto-fill statt fester Spaltenzahl: die Kacheln sind
     content-arm genug (Icon+Name+eine Meta-Zeile), dass eine feste Breite
     hier nicht nötig ist wie beim breiteren .edash-field-grid. */
  /* Feste 4 Spalten statt auto-fill/minmax — bei auto-fill blieben die
     Kacheln auf breiten Bildschirmen sehr schmal (mehr Spalten statt
     größerer Kacheln). Unter 640px zwei Spalten, sonst wären einzelne
     Kacheln auf schmalen Bildschirmen unlesbar schmal. Feste Höhe (statt nur
     min-height) sorgt dafür, dass wirklich ALLE Kacheln gleich hoch sind —
     nicht nur die einer Zeile (CSS-Grid würde das ohnehin tun, aber
     Verbraucher-Kacheln mit Gruppen-Chip hätten sonst mehr Inhalt als z. B.
     Netzbezug/Kosten und dadurch andere Bereiche zeilenweise unterschiedlich
     hoch gemacht). */
  .edash-item-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;}
  @media(max-width:640px){.edash-item-grid{grid-template-columns:repeat(2,1fr);}}
  .edash-item-tile{
    all:unset;box-sizing:border-box;display:flex;flex-direction:column;cursor:pointer;height:132px;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow);transition:border-color .12s;
  }
  .edash-item-tile:hover{border-color:var(--border-strong);}
  .edash-item-tile:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px;}
  .edash-item-tile.is-drag-over{outline:2px dashed var(--accent-line);outline-offset:2px;}
  .edash-item-accent{height:3px;flex:none;}
  /* Für Rollen ohne natürliche Sankey-Farbe (Kosten/PV-Prognose/CO2, siehe
     .edash-section-* oben) — neutraler Rahmenton statt einer erfundenen
     Farbe, dieselbe "bewusst ungefärbt"-Logik wie bei den Bereichen. */
  .edash-item-accent-neutral{background:var(--border-strong);}
  /* flex:1 — ohne das füllt der Body nur seine Inhaltshöhe, die feste
     Kachelhöhe bliebe darunter als toter Leerraum stehen und
     .edash-item-bottoms margin-top:auto (siehe unten) hätte innerhalb des
     Bodys keinen Freiraum zum Verteilen. */
  .edash-item-body{padding:10px 12px 11px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;}
  .edash-item-head{display:flex;align-items:center;gap:7px;}
  .edash-item-glyph{flex:none;width:18px;height:18px;display:flex;align-items:center;justify-content:center;}
  .edash-item-name{
    font-weight:600;font-size:calc(13px * var(--font-scale, 1));flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
  }
  .edash-item-req{
    flex:none;font-size:calc(9px * var(--font-scale, 1));font-weight:700;letter-spacing:.03em;
    color:var(--accent-bar);background:var(--accent-bar-soft);padding:2px 5px;border-radius:4px;
  }
  /* Kopf (Icon+Name) bleibt oben, alles Weitere (Chip, dann Entität/Wert)
     wird als Gruppe an den unteren Rand der Kachel gedrückt (margin-top:auto
     auf dem Wrapper) — bei fester Kachelhöhe sonst ein unschön mittig
     "schwebender" Block statt klar oben (Identität) vs. unten (Zustand)
     getrennter Information. */
  .edash-item-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;}
  .edash-item-meta{
    font-size:calc(11.5px * var(--font-scale, 1));color:var(--ink-faint);text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .edash-item-meta.is-empty{font-style:italic;}
  /* Zweite Zeile unter .edash-item-meta, bewusst IDENTISCH gestylt (nicht
     kleiner/blasser) — bisher nur für die Speicher-Kachel: bei zugeordneter
     Kapazitäts-Entität zeigt .edash-item-meta die aufgelöste kWh-Zahl
     (capacityLabel(), siehe Setup-Formular), hier zusätzlich der
     Entitätsname darunter — sonst wäre auf der Kachel nicht erkennbar, DASS
     überhaupt eine Entität (statt eines festen Werts) hinterlegt ist,
     geschweige denn welche. */
  .edash-item-meta-sub{
    font-size:calc(11.5px * var(--font-scale, 1));color:var(--ink-faint);text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .edash-item-chip{
    align-self:flex-start;max-width:100%;font-size:calc(10px * var(--font-scale, 1));padding:2px 7px;border-radius:999px;
    background:var(--surface-alt);color:var(--ink-muted);border:1px solid var(--border);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-sizing:border-box;
  }
  /* Verbraucher ohne Gruppe: eigener Chip statt einfach nichts anzuzeigen —
     macht sichtbar, dass hier (noch) keine Gruppe gesetzt ist, statt es wie
     eine leere/kaputte Kachel wirken zu lassen. Gestrichelt + Akzentfarbe
     statt der neutralen Chip-Optik = "leicht hervorgehoben", aber bewusst
     nicht in Warnfarbe (Fehlen einer Gruppe ist normal, keine Auffälligkeit). */
  .edash-item-chip-empty{background:none;border-style:dashed;border-color:var(--accent-line);color:var(--accent-line);}
  .edash-item-add{
    all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;height:132px;
    border:1px dashed var(--border-strong);border-radius:12px;cursor:pointer;
  }
  .edash-item-add-btn{
    width:28px;height:28px;border-radius:999px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--ink-muted);display:flex;align-items:center;justify-content:center;
    font-size:calc(16px * var(--font-scale, 1));line-height:1;
  }
  .edash-item-add:hover .edash-item-add-btn{color:var(--accent-line);border-color:var(--accent-line);}

  /* Einzelrollen-Popup: deutlich schmaler als der App-Standard-Dialog
     (.detail-dialog, bis 860px, für Datenqualität/Kosten-Tabellen) — hier
     stehen nur 1-4 Felder für genau EINEN Eintrag, dieselbe Größenordnung
     wie .edash-gruppen-dialog. */
  .edash-item-dialog{width:min(440px, calc(100vw - 32px));}
  /* Farbiger Streifen oben im Popup, in derselben Rollenfarbe wie
     .edash-item-accent auf der zugehörigen Kachel — schließt den optischen
     Kreis "diese Kachel gehört zu diesem Popup", ohne (wie ein vollständig
     umrandetes Popup) wie ein Warn-/Fehlerzustand zu wirken, den ein
     farbiger Rahmen um einen ganzen Dialog sonst nahelegen würde. Per
     CSS-Var (--dialog-accent, inline am jeweiligen <dialog> gesetzt) statt
     eigener Klasse je Rolle — dieselbe Variable versorgt sowohl feste als
     auch dynamische (x-for) Popups einheitlich. Neutrale Rollen (Kosten/
     Prognose/CO2/Gruppen, deren Kacheln ebenfalls nur den neutralen
     .edash-item-accent-neutral-Ton zeigen) bekommen denselben grauen Ton
     statt einer Rollenfarbe — sonst wirkt der fehlende Streifen dort wie ein
     Darstellungsfehler statt einer bewussten Auslassung. */
  /* KEIN eigenes position:relative hier — ein per showModal() geöffneter
     <dialog> bekommt von der UA-Stylesheet-Regel dialog:modal bereits
     position:fixed (zusammen mit margin:auto fürs Zentrieren) und ist damit
     schon ein positionierter Vorfahre für das ::before unten. Eine
     Autoren-Regel schlägt UA-Regeln immer, unabhängig von Spezifität —
     ein eigenes position:relative hätte also genau dieses position:fixed
     überschrieben und die native Zentrierung gebrochen (Dialog landet dann
     irgendwo im normalen Layoutfluss statt mittig im Viewport). */
  .edash-item-dialog,.edash-gruppen-dialog{--dialog-accent:var(--border-strong);}
  .edash-item-dialog::before,.edash-gruppen-dialog::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    border-radius:14px 14px 0 0;background:var(--dialog-accent);
  }
  /* margin-bottom:0 statt des app-weiten .field-Standards (20px) — der
     Abstand zwischen den Feldern kommt hier allein vom Flex-gap, sonst
     würden sich beide Abstände addieren. */
  .edash-dialog-fields{display:flex;flex-direction:column;gap:14px;}
  .edash-dialog-fields .field{margin-bottom:0;}
  /* "Entfernen"-Button nutzt bewusst die app-weite .btn-danger-Klasse (siehe
     app.css) statt einer eigenen Farbe — dieselbe Bestätigung wie beim
     Gruppen-Löschen (window.appConfirm, siehe removeRow() im Root-x-data). */
  .edash-dialog-footer{display:flex;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}

  /* Feld-Erklärungen einmal zentral über den Kacheln (siehe Template) statt
     in jeder Karte wiederholt — bei mehreren Speichern stünde derselbe
     Hinweistext sonst mehrfach identisch da. Feste vier Spalten
     (repeat(4,1fr), nicht auto-fill) — bei auto-fill fiel die vierte Spalte
     je nach Fensterbreite unvorhersehbar in eine zweite Zeile, mit einer
     festen Spaltenzahl bleiben es immer vier nebeneinander; die Beschreibung
     selbst darf innerhalb ihrer eigenen Spalte mehrzeilig umbrechen (nur
     die vier Spalten dürfen nicht umbrechen). Unter 640px zwei statt vier
     Spalten, sonst würden die Texte auf schmalen Bildschirmen zu einzelnen
     Wörtern pro Zeile zusammengequetscht. */
  .edash-speicher-legend{
    display:grid;grid-template-columns:repeat(4,1fr);gap:4px 14px;
    margin:0 0 14px;padding:10px 14px;border-radius:10px;background:var(--surface-alt);
  }
  @media(max-width:640px){.edash-speicher-legend{grid-template-columns:repeat(2,1fr);}}
  .edash-speicher-legend dt{margin:0;font-size:calc(12.5px * var(--font-scale, 1));font-weight:600;color:var(--ink);}
  .edash-speicher-legend dd{margin:1px 0 0;font-size:calc(11.5px * var(--font-scale, 1));color:var(--ink-muted);line-height:1.4;}

  /* Kapazität ist nur eine kurze Zahl (2-3 Stellen) — deutlich schmaler als
     ein Entitäts-Picker, jetzt innerhalb der einspaltigen Popup-Felder
     (.edash-dialog-fields). */
  .edash-speicher-capacity-input{max-width:84px;padding:0 8px;}
  .edash-speicher-capacity-input .edash-fixed-price-input{padding:8px 0;text-align:right;}

  /* Fester Preis/CO2-Faktor (Kosten-Bezug/-Einspeisung, CO2) — dieselbe kurze
     Zahl+Einheit-Behandlung wie .edash-speicher-capacity-input oben: ohne
     eigene Breitenbegrenzung fällt number_field()s <input> auf die
     Browser-Standardbreite (~170px) zurück, das Feld brach dadurch trotz
     inline_fallback in eine zweite Zeile um statt neben dem Entitäts-Picker
     zu stehen. Breiter als die 84px bei Speicher-Kapazität — "Ct/kWh"/
     "g/kWh" sind länger als "kWh" und hätten bei 84px der Zahl selbst kaum
     noch Platz gelassen (Suffix allein ~49px von 62px nutzbarer Breite). */
  .edash-price-fixed-input{max-width:124px;padding:0 8px;}
  .edash-price-fixed-input .edash-fixed-price-input{padding:8px 0;text-align:right;}

  .edash-list-remove{
    flex:none;width:34px;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
    color:var(--ink-faint);cursor:pointer;font-size:calc(12px * var(--font-scale, 1));line-height:1;
  }
  .edash-list-remove:hover{color:var(--danger);border-color:var(--danger);}
  .edash-setup-add{
    display:inline-flex;align-items:center;gap:6px;font-size:calc(12px * var(--font-scale, 1));color:var(--accent-line);font-weight:600;
    background:none;border:1px dashed var(--border-strong);border-radius:7px;padding:6px 10px;cursor:pointer;margin-top:2px;
  }

  /* "Gruppen"-Button neben der Verbraucher-Überschrift, zum Öffnen des
     Verwalten-Popups (Umbenennen/Löschen) — dieselbe schlichte Flex-Zeile
     wie .edash-title-row im Ansichts-Template, hier lokal benannt, weil sie
     nur Titel + EIN Button nebeneinander braucht statt eines Badge-Wraps. */
  .edash-section-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .edash-section-title-row .settings-section-title{margin:0;}
  .edash-manage-groups-btn{flex:none;padding:5px 12px;font-size:calc(12px * var(--font-scale, 1));}

  /* Eigene Farbe statt der neutralen .dd-picker-row-Optik — hebt die
     Neu-anlegen-Zeile klar von den bestehenden Gruppen darüber ab, analog zu
     .edash-setup-add (derselbe "etwas hinzufügen"-Grundton). */
  .edash-group-create-row{color:var(--accent-line);font-weight:600;}

  /* Gruppen-Verwalten-Popup: schmaler als der App-Standard-Dialog
     (.detail-dialog ist auf bis zu 860px ausgelegt, für Datenqualität/
     Kosten-Aufschlüsselungen mit Tabellen) — hier reicht eine kompakte
     Liste kurzer Namen. */
  .edash-gruppen-dialog{width:min(420px, calc(100vw - 32px));}
  .edash-gruppen-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .edash-gruppen-row{display:flex;align-items:center;gap:8px;}
  .edash-gruppen-rename-input{
    flex:1;min-width:0;font-family:var(--font-mono);font-size:calc(13px * var(--font-scale, 1));
    padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    box-sizing:border-box;
  }
  .edash-gruppen-rename-input:focus{outline:none;border-color:var(--accent-line);}
  .edash-gruppen-usage{
    flex:none;font-size:calc(12px * var(--font-scale, 1));color:var(--ink-faint);white-space:nowrap;
  }
  .edash-gruppen-add{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .edash-gruppen-add input[type="text"]{
    flex:1;min-width:0;font-family:var(--font-mono);font-size:calc(13px * var(--font-scale, 1));
    padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
    box-sizing:border-box;
  }
  .edash-gruppen-add input[type="text"]:focus{outline:none;border-color:var(--accent-line);}
  /* Feste Breite statt content-basierter Auto-Breite, exakt so groß wie die
     Verbraucherzahl+Lösch-Button-Spalte der Zeilen darüber (.edash-gruppen-
     usage ~86px + 8px Gap + .edash-list-remove 34px) — sonst bestimmt allein
     die (kürzere) Button-Beschriftung "+ Hinzufügen" die zweite Spalte, das
     Eingabefeld wird dadurch breiter als die Namensfelder darüber statt mit
     ihnen bündig abzuschließen. */
  .edash-gruppen-add .edash-setup-add{flex:none;width:128px;justify-content:center;}
</style>
</head>
