name: "Zeitarchiv"
version: "0.76.1"
slug: "zeitarchiv"
description: "Kompaktes Zeitreihen-Archiv für Home Assistant"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
stage: stable
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: "Zeitarchiv"
backup: cold
backup_exclude:
  - "backups/**"
  - ".zeitarchiv-restore-staging/**"
  - ".zeitarchiv-restore-rollback-*/**"
panel_icon: "mdi:database-clock"
options:
  timezone: "Europe/Berlin"
schema:
  timezone: "match(^[A-Za-z][A-Za-z0-9._+-]*(/[A-Za-z0-9][A-Za-z0-9._+-]*)*$)"
ports:
  8127/tcp: 8127
ports_description:
  8127/tcp: "Zeitarchiv REST-API"
