name: "Zeitarchiv"
version: "1.10.0"
slug: "zeitarchiv"
description: "Kompaktes Zeitreihen-Archiv für Home Assistant"
url: "https://github.com/bertel2020/HA-Apps/tree/main/zeitarchiv"
# Vorgebaute Images je Architektur (Workflow "Zeitarchiv Image" im Repo);
# der Supervisor ersetzt {arch} und zieht image:<version> statt das
# Dockerfile lokal zu bauen.
image: "ghcr.io/bertel2020/zeitarchiv-{arch}"
arch:
  - amd64
  - aarch64
init: false
# Nur für das externe Backup-Ziel: Netzwerkspeicher, die Home Assistant mit der
# Verwendung „Medien“ oder „Share“ einbindet, erscheinen so unter /media bzw.
# /share (storage/backup_external.py). Geschrieben wird nur in den gewählten
# Ordner.
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
startup: application
boot: auto
stage: stable
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: "Zeitarchiv"
backup: cold
backup_exclude:
  - "backups/**"
  - ".zeitarchiv-restore-staging/**"
  - ".zeitarchiv-restore-rollback-*/**"
  # Hochgeladene Importdaten bleiben bis „Daten löschen“ liegen und können
  # mehrere GB groß sein; jederzeit neu hochladbar, wie im eigenen Backup.
  - "symcon_import/**"
  - "csv_import/**"
panel_icon: "mdi:database-clock"
options:
  timezone: "Europe/Berlin"
  demo_mode: false
  webdav_password: ""
schema:
  timezone: "match(^[A-Za-z][A-Za-z0-9._+-]*(/[A-Za-z0-9][A-Za-z0-9._+-]*)*$)"
  demo_mode: "bool"
  webdav_password: "password?"
ports:
  8127/tcp: 8127
ports_description:
  8127/tcp: "Zeitarchiv REST-API"
