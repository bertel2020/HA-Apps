# Nginx-Zugriffszeilen würden die an Uvicorn weitergereichten Requests doppelt
# protokollieren. Zeitarchiv übernimmt sie differenziert im App-Middleware;
# echte Gateway-Fehler bleiben über stderr im Supervisor sichtbar.
access_log off;
error_log /dev/stderr warn;

# Die Weboberflaeche ist nur ueber den authentifizierenden Supervisor-Ingress
# erreichbar. Home Assistant verwendet fuer den Ingress-Proxy 172.30.32.2.
server {
    listen 8099;
    server_name _;

    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    # Symcon- und CSV-Importe koennen gross sein. Die Anwendung verarbeitet
    # diese selbst; Nginx soll hier keine zusaetzliche 1-MB-Grenze einfuehren.
    # Etwas oberhalb des 2-GiB-Dateilimits, weil multipart/form-data noch
    # Header/Boundary-Overhead zum eigentlichen ZIP hinzufügt.
    client_max_body_size 2050m;

    location / {
        proxy_pass http://127.0.0.1:8128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Der Supervisor liefert das dynamische Ingress-Präfix pro Add-on.
        # Explizit weiterreichen, damit absolute Navigationsziele innerhalb
        # dieses Präfixes bleiben und nicht auf Home Assistants / springen.
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# Der nach aussen veroeffentlichte Port ist ausschliesslich fuer die
# Zeitarchiv-Integration bestimmt. Alle UI-, Lese-, Export-, Backup-, Import-
# und Verwaltungsrouten werden hier bereits am Gateway abgewiesen.
server {
    listen 8127;
    server_name _;

    client_max_body_size 2m;

    location = /api/health {
        proxy_pass http://127.0.0.1:8128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/write {
        proxy_pass http://127.0.0.1:8128;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
