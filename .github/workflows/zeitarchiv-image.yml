# Vorgebaute Add-on-Images für amd64 und aarch64 nach ghcr.io — der Supervisor
# zieht sie über "image:" in zeitarchiv/config.yaml, statt das Dockerfile auf
# jedem Home-Assistant-Host lokal zu bauen (schnellere Installation/Updates,
# echte Fortschrittsanzeige). Tag = Inhalt von zeitarchiv/VERSION; ein Push
# ohne Versionswechsel überschreibt denselben Tag, was der Supervisor bei
# gleicher Version ohnehin nicht erneut zieht.
name: Zeitarchiv Image

on:
  push:
    branches: [main]
    paths:
      - "zeitarchiv/**"
      - "!zeitarchiv/docs/**"
      - "!zeitarchiv/tests/**"
      - "!zeitarchiv/**.md"
      - ".github/workflows/zeitarchiv-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(tr -d '[:space:]' < zeitarchiv/VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: zeitarchiv
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/bertel2020/zeitarchiv-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/bertel2020/zeitarchiv-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/bertel2020/HA-Apps
            org.opencontainers.image.description=Zeitarchiv – Zeitreihen-Archiv für Home Assistant (${{ matrix.arch }})
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
