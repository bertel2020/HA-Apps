name: Zeitarchiv Tests

on:
  push:
    branches: [main]
    paths: ["zeitarchiv/**", ".github/workflows/zeitarchiv-tests.yml"]
  pull_request:
    paths: ["zeitarchiv/**", ".github/workflows/zeitarchiv-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeitarchiv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v
