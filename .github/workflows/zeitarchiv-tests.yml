name: Zeitarchiv Tests

on:
  push:
    branches: [main]
    paths: ["zeitarchiv/**", ".github/workflows/zeitarchiv-tests.yml"]
  pull_request:
    paths: ["zeitarchiv/**", ".github/workflows/zeitarchiv-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeitarchiv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Der Regelsatz steht in zeitarchiv/ruff.toml und ist bewusst eng —
      # siehe die Begründung dort. Vor den Tests, weil ein undefinierter Name
      # oder ein toter Import schneller gefunden ist als über einen Testlauf.
      - run: ruff check .
      - run: pytest tests/ -v
